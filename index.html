<title>FitPro Manager — Montagem de Treinos</title>
<style>
  :root{
    --bg:#f7f7f9; --panel:#ffffff; --panel2:#f0eef7; --line:#e2e2e8;
    --accent:#6e2de7; --accent2:#7c3aed; --text:#18181b; --muted:#6b6b76;
    --green:#059669; --red:#dc2626; --yellow:#ca8a04;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-anchor:none;}
  .app{display:flex;min-height:100vh;}
  nav{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0;overflow-anchor:none;}
  nav h1{font-size:18px;padding:0 20px 20px;margin:0;color:var(--accent);border-bottom:1px solid var(--line);}
  nav h1 span{color:var(--accent2);}
  nav .tab{padding:12px 20px;cursor:pointer;color:var(--muted);font-size:14px;border-left:3px solid transparent;}
  nav .tab:hover{background:var(--panel2);color:var(--text);}
  nav .tab.active{color:var(--text);border-left-color:var(--accent);background:var(--panel2);font-weight:600;}
  main{flex:1;padding:28px 36px;max-width:1100px;}
  h2{margin-top:0;font-size:22px;}
  .sub{color:var(--muted);font-size:13px;margin-top:-8px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:7px;font-size:14px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);}
  textarea{width:100%;min-height:50px;font-family:inherit;}
  button{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer;font-size:14px;}
  button:hover{filter:brightness(1.1);}
  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  button.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.green{background:rgba(52,211,153,.15);color:var(--green);}
  .tag.gray{background:rgba(148,163,184,.15);color:var(--muted);}
  .tag.yellow{background:rgba(251,191,36,.15);color:var(--yellow);}
  .tag.red{background:rgba(248,113,113,.15);color:var(--red);}
  .calWrap{overflow-x:auto;}

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(!raw){
    const seed = { students:[buildDemoStudent()], exercises: defaultExerciseLibrary(), bloqueios: [], lixeiraAlunos: [] };
    localStorage.setItem(DB_KEY, JSON.stringify(seed));
    localStorage.setItem(MIGR_KEY, '1');
    return seed;
  }
  const data = JSON.parse(raw);
  if(!data.bloqueios) data.bloqueios = [];
  if(!data.lixeiraAlunos) data.lixeiraAlunos = [];
  // migração automática: quem já usava a versão antiga (poucos exercícios) recebe a biblioteca completa
  if(localStorage.getItem(MIGR_KEY) !== '1'){
    const existing = new Set((data.exercises||[]).map(e=>e.nome.trim().toLowerCase()));
    const toAdd = defaultExerciseLibrary().filter(e=>!existing.has(e.nome.trim().toLowerCase()));
    data.exercises = (data.exercises||[]).concat(toAdd);
    localStorage.setItem(DB_KEY, JSON.stringify(data));
    localStorage.setItem(MIGR_KEY, '1');
  }
  return data;
}

const REAVAL_DIAS_LIMITE = 45; // ~6-7 semanas sem atualizar medidas
function ultimaAvaliacao(s){
  const avs = (s.avaliacoes||[]).slice().filter(a=>a.data).sort((a,b)=> b.data.localeCompare(a.data));
  return avs[0] || null;
}
function diasDesde(dataISO){
  if(!dataISO) return null;
  const d = new Date(dataISO+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function reavaliacaoStatus(s){
  if((s.status||'ativo')==='pausado') return null;
  const ult = ultimaAvaliacao(s);
  if(!ult) return { atrasada:true, dias:null, motivo:'nunca' };
  const dias = diasDesde(ult.data);
  if(dias!==null && dias > REAVAL_DIAS_LIMITE) return { atrasada:true, dias, motivo:'antiga' };
  return { atrasada:false, dias };
}

// ---------- VOLUME DE TREINO (séries x reps x carga) ----------
function parseNumeroMedio(str){
  if(!str) return null;
  const matches = String(str).match(/\d+(?:[.,]\d+)?/g);
  if(!matches || matches.length===0) return null;
  const nums = matches.map(m=>parseFloat(m.replace(',','.')));
  return nums.reduce((a,b)=>a+b,0)/nums.length;
}
function calcularVolumeExercicio(e){
  const series = parseNumeroMedio(e.series);
  const reps = parseNumeroMedio(e.reps);
  const carga = parseNumeroMedio(e.obs);
  if(series===null || reps===null || carga===null) return null;
  return series * reps * carga;
}
function volumeTotalFicha(f){
  return f.exercicios.reduce((sum,e)=>{ const v = calcularVolumeExercicio(e); return sum + (v||0); }, 0);
}
function formatVolume(v){
  if(v===null || v===undefined) return '-';
  return Math.round(v).toLocaleString('pt-BR');
}

const BACKUP_KEY = 'fitpro_last_backup';
const BACKUP_DIAS_LIMITE = 7;
function registrarBackupFeito(){

function backupStatus(){
  const ultima = localStorage.getItem(BACKUP_KEY);
  if(!ultima) return { atrasado:true, dias:null, nunca:true };
  const dias = diasDesde(ultima);
  if(dias!==null && dias > BACKUP_DIAS_LIMITE) return { atrasado:true, dias, nunca:false };

}

const METODOS_PAGAMENTO = ['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Transferência','Boleto','Outro'];

function mesAtual(){ return new Date().toISOString().slice(0,7); }

function formatMes(mes){
  if(!mes) return '-';
  const partes = mes.split('-');
  if(partes.length!==2) return mes;
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const idx = parseInt(partes[1],10)-1;
  if(idx<0||idx>11) return mes;
  return `${meses[idx]}/${partes[0]}`;
}

function statusPagamentoAluno(s){
  const cfg = s.pagamento || {};
  const registros = s.pagamentos || [];
  const mAtual = mesAtual();
  const registroAtual = registros.find(r=>r.mes===mAtual) || null;
  if(registroAtual && registroAtual.status==='pago') return { status:'em_dia', registro: registroAtual };
  if(!cfg.diaVencimento) return { status:'sem_config', registro: registroAtual };
  const hoje = new Date();
  const vencimento = new Date(hoje.getFullYear(), hoje.getMonth(), cfg.diaVencimento, 23, 59, 59);
  if(hoje > vencimento) return { status:'atrasado', registro: registroAtual };
  return { status:'pendente', registro: registroAtual };
}

function statusPagamentoLabel(status){
  return { em_dia:'✅ Em dia', pendente:'🕒 Pendente', atrasado:'⚠️ Atrasado', sem_config:'⚙️ Não configurado' }[status] || status;
}

// ---------- AGENDA SEMANAL ----------
const DIAS_SEMANA = [
  {key:'seg', label:'Segunda'},
  {key:'ter', label:'Terça'},
  {key:'qua', label:'Quarta'},
  {key:'qui', label:'Quinta'},
  {key:'sex', label:'Sexta'},
  {key:'sab', label:'Sábado'},
  {key:'dom', label:'Domingo'},
];

function diaSemanaFromISODate(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const map = ['dom','seg','ter','qua','qui','sex','sab'];
  return map[d.getDay()];
}
function isoFromDateObj(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoHoje(){ return isoFromDateObj(new Date()); }
function addDiasISO(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return isoFromDateObj(d);
}
function segundaFeiraDaSemana(iso){
  const d = new Date(iso+'T00:00:00');
  const dow = d.getDay();
  const diff = dow===0 ? -6 : (1-dow);
  d.setDate(d.getDate()+diff);
  return isoFromDateObj(d);
}
function divisaoParaSemana(s, segundaISO){
  s.planejamentoSemanas = s.planejamentoSemanas || {};
  return s.planejamentoSemanas[segundaISO] || s.divisaoSemanal || {};
}
function fichaIdParaData(s, dataISO){
  const seg = segundaFeiraDaSemana(dataISO);
  const diaKey = diaSemanaFromISODate(dataISO);
  return divisaoParaSemana(s, seg)[diaKey] || '';
}

// ---------- PRESENÇA (compareceu / faltou / reposição) ----------
function getPresenca(s, slotId, dataISO){
  return (s.presencas||[]).find(p=>p.slotId===slotId && p.data===dataISO) || null;
}
function setPresenca(s, slotId, dataISO, status){
  if(!s.presencas) s.presencas = [];
  const existente = s.presencas.find(p=>p.slotId===slotId && p.data===dataISO);
  if(!status){
    s.presencas = s.presencas.filter(p=>!(p.slotId===slotId && p.data===dataISO));
    return;
  }
  if(existente){ existente.status = status; }
  else { s.presencas.push({slotId, data:dataISO, status}); }
}
const PRESENCA_LABEL = { compareceu:'✅ Compareceu', faltou:'❌ Faltou', reposicao:'🔁 Reposição' };

const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEMANA_ORDEM = ['seg','ter','qua','qui','sex','sab','dom'];
const DIAS_SEMANA_CURTO = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

function ocorrenciasDoDia(alunos, dataISO, diaKey){
  const out = [];
  alunos.forEach(s=>{
    (s.agenda||[]).forEach(a=>{
      if(a.tipo==='unico'){
        if(a.data===dataISO) out.push({...a, aluno:s});
      } else if(a.dia===diaKey){
        out.push({...a, aluno:s});
      }
    });
  });
  out.sort((a,b)=> (a.horario||'').localeCompare(b.horario||''));
  return out.map(a=>{
    const presenca = getPresenca(a.aluno, a.id, dataISO);
    return {...a, _tipoItem:'aluno', presencaStatus: presenca ? presenca.status : null};
  });
}

function bloqueiosDoDia(dataISO, diaKey){
  return (db.bloqueios||[]).filter(b=>{
    if(b.tipo==='unico') return b.data===dataISO;
    return b.dia===diaKey;
  }).map(b=>({...b, _tipoItem:'bloqueio', horario:b.horarioInicio||''}));
}

function itensDoDia(alunos, dataISO, diaKey){
  return ocorrenciasDoDia(alunos, dataISO, diaKey)
    .concat(bloqueiosDoDia(dataISO, diaKey))
    .sort((a,b)=> (a.horario||'').localeCompare(b.horario||''));
}

// ---------- CONFLITO DE HORÁRIO ----------
function itensParaConflito(dia, data, tipo){
  const alunosAtivos = db.students.filter(s=>(s.status||'ativo')==='ativo');
  if(tipo==='unico'){
    return itensDoDia(alunosAtivos, data, dia);
  }
  // recorrente: só compara com outros itens recorrentes do mesmo dia da semana
  // (comparar com itens únicos exigiria checar infinitas datas futuras)
  const out = [];
  alunosAtivos.forEach(s=>{
    (s.agenda||[]).forEach(a=>{
      if((a.tipo||'recorrente')==='recorrente' && a.dia===dia) out.push({...a, _tipoItem:'aluno', aluno:s});
    });
  });
  (db.bloqueios||[]).forEach(b=>{
    if((b.tipo||'recorrente')==='recorrente' && b.dia===dia) out.push({...b, _tipoItem:'bloqueio', horario:b.horarioInicio||''});
  });
  return out;
}
function horariosConflitam(iniA, fimA, iniB, fimB){
  if(!iniA || !iniB) return false;
  const temFaixaA = !!fimA, temFaixaB = !!fimB;
  if(!temFaixaA && !temFaixaB) return iniA === iniB;
  if(temFaixaA && !temFaixaB) return iniB >= iniA && iniB < fimA;
  if(!temFaixaA && temFaixaB) return iniA >= iniB && iniA < fimB;
  return iniA < fimB && iniB < fimA;
}
function encontrarConflitos({dia, data, tipo, horarioInicio, horarioFim, excluirTipoItem, excluirId}){
  const candidatos = itensParaConflito(dia, data, tipo);
  return candidatos.filter(item=>{
    if(excluirId && item.id===excluirId && item._tipoItem===excluirTipoItem) return false;
    const itemInicio = item._tipoItem==='bloqueio' ? (item.horarioInicio||'') : (item.horario||'');
    const itemFim = item._tipoItem==='bloqueio' ? (item.horarioFim||'') : '';
    return horariosConflitam(horarioInicio, horarioFim, itemInicio, itemFim);
  });
}
function descreverConflito(item){
  if(item._tipoItem==='bloqueio'){
    return `🚫 ${item.titulo||'Indisponível'} (${item.horarioInicio}${item.horarioFim?'–'+item.horarioFim:''})`;
  }
  return `${item.aluno.nome} (${item.horario})`;
}

function bloqueioChipHtml(b){
  return `

    </div>
  `;

function buildMesGrid(ano, mes, alunos, hojeISO){
  const primeiroDia = new Date(ano, mes, 1);
  const totalDias = new Date(ano, mes+1, 0).getDate();
  const offsetInicio = (primeiroDia.getDay()+6)%7; // 0 = segunda-feira
  const celulasDias = [];
  for(let i=0;i<offsetInicio;i++) celulasDias.push(null);
  for(let d=1; d<=totalDias; d++) celulasDias.push(d);
  while(celulasDias.length % 7 !== 0) celulasDias.push(null);

  const cabecalho = DIAS_SEMANA_CURTO.map(l=>`<div class="calCabecalho">${l}</div>`).join('');
  const celulas = celulasDias.map((d, idx)=>{
    if(d===null) return `<div class="calCell calCellVazia"></div>`;
    const dataISO = `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const diaKey = DIAS_SEMANA_ORDEM[idx % 7];
    const itens = itensDoDia(alunos, dataISO, diaKey);
    const ehHoje = dataISO === hojeISO;
    return `
      <div class="calCell ${ehHoje?'calCellHoje':''}">
        <div class="calCellHeader">
          <span class="calNum">${d}</span>
          <span class="calAdd noprint" data-cal-add="${dataISO}" title="Adicionar horário neste dia">+</span>
        </div>
        <div class="calCellBody">${itens.map(item=>itemChipHtml(item, dataISO)).join('')}</div>
      </div>
    `;
  }).join('');
  return `<div class="calWrap"><div class="calGrid">${cabecalho}${celulas}</div></div>`;
}

function buildSemanaGrid(inicioSemana, alunos, hojeISO){
  const cols = [];
  for(let i=0;i<7;i++){
    const d = new Date(inicioSemana);
    d.setDate(inicioSemana.getDate()+i);
    const dataISO = isoFromDateObj(d);
    const diaKey = DIAS_SEMANA_ORDEM[i];
    const itens = itensDoDia(alunos, dataISO, diaKey);
    const ehHoje = dataISO === hojeISO;
    cols.push(`
      <div class="calCell calCellSemana ${ehHoje?'calCellHoje':''}">
        <div class="calCellHeader">
          <span class="calNum">${DIAS_SEMANA_CURTO[i]} ${d.getDate()}/${d.getMonth()+1}</span>
          <span class="calAdd noprint" data-cal-add="${dataISO}" title="Adicionar horário neste dia">+</span>
        </div>
        <div class="calCellBody" style="max-height:340px;">${itens.map(item=>itemChipHtml(item, dataISO)).join('') || '<div class="meta" style="text-align:center;">-</div>'}</div>
      </div>
    `);
  }
  return `<div class="calWrap"><div class="calGrid">${cols.join('')}</div></div>`;
}

function buildDiaView(dataISO, alunos){
  const diaKey = diaSemanaFromISODate(dataISO);
  const itens = itensDoDia(alunos, dataISO, diaKey);
  return `<div class="card">${itens.length ? itens.map(item=>itemChipHtml(item, dataISO)).join('') : '<div class="empty">Nenhum horário marcado para este dia.</div>'}</div>`;
}

function renderAgenda(){
  if(!state.agendaView) state.agendaView = 'mes';
  if(!state.agendaRef) state.agendaRef = isoHoje();
  const hojeISO = isoHoje();
  const alunos = db.students.filter(s=>(s.status||'ativo')==='ativo');
  const refDate = new Date(state.agendaRef+'T00:00:00');

  let titulo = '', corpo = '';
  if(state.agendaView==='mes'){
    const ano = refDate.getFullYear(), mes = refDate.getMonth();
    titulo = `${NOMES_MES[mes]} de ${ano}`;
    corpo = buildMesGrid(ano, mes, alunos, hojeISO);
  } else if(state.agendaView==='semana'){
    const offset = (refDate.getDay()+6)%7;
    const inicioSemana = new Date(refDate);
    inicioSemana.setDate(refDate.getDate()-offset);
    const fimSemana = new Date(inicioSemana);
    fimSemana.setDate(inicioSemana.getDate()+6);
    titulo = `${String(inicioSemana.getDate()).padStart(2,'0')}/${String(inicioSemana.getMonth()+1).padStart(2,'0')} a ${String(fimSemana.getDate()).padStart(2,'0')}/${String(fimSemana.getMonth()+1).padStart(2,'0')}`;
    corpo = buildSemanaGrid(inicioSemana, alunos, hojeISO);
  } else {
    const diaKey = diaSemanaFromISODate(state.agendaRef);
    const diaLabel = DIAS_SEMANA.find(x=>x.key===diaKey).label;
    titulo = `${diaLabel}, ${String(refDate.getDate()).padStart(2,'0')}/${String(refDate.getMonth()+1).padStart(2,'0')}/${refDate.getFullYear()}`;
    corpo = buildDiaView(state.agendaRef, alunos);
  }

  return `
    <h2>🗓️ Agenda</h2>
    <div class="sub">Calendário com os horários de treino de cada aluno.</div>
    <div class="row noprint" style="margin-bottom:14px;align-items:center;flex-wrap:wrap;">
      <button class="secondary small" id="agPrev">&larr;</button>
      <strong style="min-width:170px;text-align:center;">${titulo}</strong>
      <button class="secondary small" id="agNext">&rarr;</button>
      <button class="ghost small" id="agHojeBtn">Hoje</button>
      <select id="agViewSelect" style="width:auto;padding:7px 10px;font-size:13px;">
        <option value="dia" ${state.agendaView==='dia'?'selected':''}>Dia</option>
        <option value="semana" ${state.agendaView==='semana'?'selected':''}>Semana</option>
        <option value="mes" ${state.agendaView==='mes'?'selected':''}>Mês</option>
      </select>
      <button class="secondary" id="btnNovoBloqueio" style="margin-left:auto;">🚫 Bloquear horário</button>
      <button id="btnNovoHorario">+ Adicionar horário</button>
    </div>
    <div class="row noprint" style="margin-bottom:14px;gap:16px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;">
      <span><span class="legendDot" style="background:var(--green);"></span>Compareceu</span>
      <span><span class="legendDot" style="background:var(--red);"></span>Faltou</span>
      <span><span class="legendDot" style="background:var(--yellow);"></span>Reposição</span>
      <span><span class="legendDot" style="background:var(--muted);"></span>Indisponível</span>
      <span>Clique num horário para marcar presença</span>
    </div>
    ${corpo}
  `;
}

function openOcorrenciaModal(studentId, slotId, dataISO){
  const s = db.students.find(x=>x.id===studentId);
  const slot = s && (s.agenda||[]).find(x=>x.id===slotId);
  if(!s || !slot) return;
  const presenca = getPresenca(s, slotId, dataISO);
  const statusAtual = presenca ? presenca.status : null;
  openModal(`
    <h3>${escapeHtml(s.nome)}</h3>
    <div class="meta" style="margin-bottom:14px;">${formatDate(dataISO)} às ${escapeHtml(slot.horario||'-')} ${slot.tipo==='unico'?'(horário único)':'(recorrente)'}</div>
    <div class="field"><label>Presença nesta data</label>
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        <button class="small" id="ocCompareceu" style="${statusAtual==='compareceu'?'background:var(--green);color:#fff;border-color:var(--green);':'background:var(--panel2);color:var(--text);border:1px solid var(--line);'}">✅ Compareceu</button>
        <button class="small" id="ocFaltou" style="${statusAtual==='faltou'?'background:var(--red);color:#fff;border-color:var(--red);':'background:var(--panel2);color:var(--text);border:1px solid var(--line);'}">❌ Faltou</button>
        <button class="small" id="ocReposicao" style="${statusAtual==='reposicao'?'background:var(--yellow);color:#fff;border-color:var(--yellow);':'background:var(--panel2);color:var(--text);border:1px solid var(--line);'}">🔁 Reposição</button>
        ${statusAtual ? `<button class="ghost small" id="ocLimpar">Limpar marcação</button>` : ''}
      </div>
    </div>
    <div class="actions" style="justify-content:space-between;">
      <button class="ghost small" id="ocEditar">Editar / excluir horário</button>
      <button class="secondary" onclick="closeModal()">Fechar</button>
    </div>
  `);
  function marcar(status){
    setPresenca(s, slotId, dataISO, status);
    saveDB(); closeModal(); render();
  }
  document.getElementById('ocCompareceu').onclick = ()=> marcar('compareceu');
  document.getElementById('ocFaltou').onclick = ()=> marcar('faltou');
  document.getElementById('ocReposicao').onclick = ()=> marcar('reposicao');
  const ocLimpar = document.getElementById('ocLimpar');
  if(ocLimpar) ocLimpar.onclick = ()=> marcar(null);
  document.getElementById('ocEditar').onclick = ()=>{ openAgendaSlotModal(studentId, slotId); };
}

function openBloqueioModal(bloqueioId, presetData){

    <h3>${editing?'Editar':'Bloquear'} horário</h3>
    <div class="field"><label>Título</label><input id="blTitulo" value="${editing?escapeAttr(bloqueio.titulo||''):''}" placeholder="Ex: Almoço, Compromisso pessoal"></div>

        <option value="recorrente" ${tipoAtual==='recorrente'?'selected':''}>🔁 Toda semana (recorrente)</option>

    </div>

      <div class="field" style="flex:1" id="blDiaWrap"><label>Dia da semana</label>
        <select id="blDia">
          ${DIAS_SEMANA.map(d=>`<option value="${d.key}" ${diaPadrao===d.key?'selected':''}>${d.label}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="flex:1" id="blDataWrap"><label>Data</label>
        <input id="blData" type="date" value="${escapeAttr(dataPadrao)}">
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>Início</label><input id="blInicio" type="time" value="${editing?escapeAttr(bloqueio.horarioInicio||''):''}"></div>
      <div class="field" style="flex:1"><label>Fim (opcional)</label><input id="blFim" type="time" value="${editing?escapeAttr(bloqueio.horarioFim||''):''}"></div>
    </div>
    <div class="actions">
      ${editing?`<button class="danger" id="blDel" style="margin-right:auto;">Excluir</button>`:''}
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button id="blSave">Salvar</button>
    </div>
  `);

  function syncTipoVisibility(){
    const tipo = document.getElementById('blTipo').value;
    document.getElementById('blDiaWrap').style.display = tipo==='recorrente' ? '' : 'none';
    document.getElementById('blDataWrap').style.display = tipo==='unico' ? '' : 'none';
  }
  document.getElementById('blTipo').onchange = syncTipoVisibility;
  syncTipoVisibility();

  document.getElementById('blSave').onclick = ()=>{
    const titulo = document.getElementById('blTitulo').value.trim() || 'Indisponível';
    const tipo = document.getElementById('blTipo').value;
    const horarioInicio = document.getElementById('blInicio').value;
    const horarioFim = document.getElementById('blFim').value;
    if(!horarioInicio){ showToast('Informe o horário de início.', 'error'); return; }
    let dia = '', data = '';
    if(tipo==='recorrente'){
      dia = document.getElementById('blDia').value;
    } else {
      data = document.getElementById('blData').value;
      if(!data){ showToast('Informe a data.', 'error'); return; }
      dia = diaSemanaFromISODate(data);
    }
    if(!db.bloqueios) db.bloqueios = [];
    const salvar = ()=>{
      if(editing){
        bloqueio.titulo=titulo; bloqueio.tipo=tipo; bloqueio.dia=dia; bloqueio.data=data; bloqueio.horarioInicio=horarioInicio; bloqueio.horarioFim=horarioFim;
      } else {
        db.bloqueios.push({id:uid(), titulo, tipo, dia, data, horarioInicio, horarioFim});
      }
      saveDB(); closeModal(); render();
    };
    const conflitos = encontrarConflitos({dia, data, tipo, horarioInicio, horarioFim, excluirTipoItem:'bloqueio', excluirId: editing?bloqueio.id:null});
    if(conflitos.length){
      const lista = conflitos.map(descreverConflito).join(', ');
      showConfirm(`Já existe nesse horário: ${lista}. Deseja bloquear mesmo assim?`, salvar, {confirmLabel:'Bloquear mesmo assim'});
    } else {
      salvar();
    }
  };
  if(editing){
    document.getElementById('blDel').onclick = ()=>{
      showConfirm('Remover este bloqueio?', ()=>{
        const idx = db.bloqueios.findIndex(x=>x.id===bloqueio.id);
        const removido = db.bloqueios[idx];
        db.bloqueios.splice(idx,1);
        saveDB(); closeModal(); render();
        showToastDesfazer('Bloqueio removido.', ()=>{
          db.bloqueios.splice(idx,0,removido);
          saveDB(); render();
        });
      }, {danger:true, confirmLabel:'Excluir'});
    };
  }
}

];
function buildComparisonTable(avaliacoesAsc){
  const comAlgumDado = avaliacoesAsc.filter(av=> TABELA_COMPARATIVA_PARAMS.some(p=> (av[p.key]||'').toString().trim() !== ''));
  if(comAlgumDado.length < 2) return '';
  const rows = TABELA_COMPARATIVA_PARAMS.map(p=>{
    const temAlgum = comAlgumDado.some(av=> (av[p.key]||'').toString().trim() !== '');
    if(!temAlgum) return '';
    return `<tr><td>${escapeHtml(p.label)}</td>${comAlgumDado.map(av=>`<td style="text-align:center;">${escapeHtml(av[p.key]||'-')}</td>`).join('')}</tr>`;
  }).join('');
  if(!rows) return '';
  return `
    <div class="card" style="overflow-x:auto;">
      <div style="font-weight:600;margin-bottom:10px;">📏 Tabela comparativa de medidas</div>
      <table style="min-width:${360+comAlgumDado.length*90}px;">
        <thead><tr><th>Parâmetros</th>${comAlgumDado.map(av=>`<th style="text-align:center;">${formatDate(av.data)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function buildEvolutionChart(avaliacoesAsc, metricKey, unit){
  const pontos = avaliacoesAsc
    .map(av=>({data:av.data, valor: parseFloat(String(av[metricKey]).replace(',','.'))}))
    .filter(p=> !isNaN(p.valor));
  if(pontos.length < 2){
    return '<div class="empty">Registre pelo menos 2 avaliações com esse dado preenchido para ver o gráfico.</div>';
  }
  const W = 640, H = 220, padL = 46, padR = 20, padT = 20, padB = 34;
  const vals = pontos.map(p=>p.valor);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  const x = i => padL + (i/(pontos.length-1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - min)/range) * (H - padT - padB);
  const linePoints = pontos.map((p,i)=> `${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const dots = pontos.map((p,i)=> `
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="4" fill="var(--accent)"></circle>
    <text x="${x(i).toFixed(1)}" y="${(y(p.valor)-10).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text)" font-weight="600">${p.valor}${unit}</text>
    <text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${formatDate(p.data)}</text>
  `).join('');
  const first = pontos[0].valor, last = pontos[pontos.length-1].valor;
  const diff = last - first;
  const diffColor = diff>0?'var(--green)':(diff<0?'var(--red)':'var(--muted)');
  const diffArrow = diff>0?'▲':(diff<0?'▼':'—');
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span class="meta">${pontos.length} registro(s)</span>
      <span style="color:${diffColor};font-weight:700;font-size:13px;">${diffArrow} ${diff>0?'+':''}${diff.toFixed(1)}${unit} desde ${formatDate(pontos[0].data)}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"></line>
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2.5"></polyline>
      ${dots}
    </svg>
  `;
}

function buildPlanejamentoHtml(s){
  const fichasAtivas = s.fichas.filter(f=>f.ativa);
  if(fichasAtivas.length===0) return '';
  s.planejamentoSemanas = s.planejamentoSemanas || {};
  const segundaAtual = segundaFeiraDaSemana(isoHoje());
  const qtdSemanas = state.planejamentoSemanasQtd || 3;
  let semanasHtml = '';
  for(let i=0;i<qtdSemanas;i++){
    const segISO = addDiasISO(segundaAtual, i*7);
    const domISO = addDiasISO(segISO, 6);
    const isAtual = i===0;
    const divisao = divisaoParaSemana(s, segISO);
    let diasHtml = '';
    DIAS_SEMANA_ORDEM.forEach((diaKey,idx)=>{
      const dataISO = addDiasISO(segISO, idx);
      const fichaId = divisao[diaKey] || '';
      const ficha = fichaId ? fichasAtivas.find(f=>f.id===fichaId) : null;
      const chave = `${segISO}|${diaKey}`;
      const expandido = state.planejamentoExpandido === chave;
      const dObj = new Date(dataISO+'T00:00:00');
      const dataCurta = `${String(dObj.getDate()).padStart(2,'0')}/${String(dObj.getMonth()+1).padStart(2,'0')}`;
      diasHtml += `
        <div class="planDia ${expandido?'planDiaExpandido':''}">
          <div class="planDiaData">${DIAS_SEMANA_CURTO[idx]} · ${dataCurta}</div>
          <div class="planDiaFicha" data-plan-toggle="${chave}">${ficha ? ('Ficha '+escapeHtml(ficha.letra)) : 'Descanso'} <span class="planDiaSeta">${expandido?'▲':'▼'}</span></div>
          ${expandido ? `
            <select class="planDiaSelect" data-plan-select="${chave}">
              <option value="">Descanso</option>
              ${fichasAtivas.map(f=>`<option value="${f.id}" ${fichaId===f.id?'selected':''}>Ficha ${escapeHtml(f.letra)}</option>`).join('')}
            </select>
            ${ficha ? `
              <div class="planDiaExercicios">
                ${ficha.exercicios.slice(0,4).map(e=>`<div class="planDiaEx">${escapeHtml(e.nome)}<span>${escapeHtml(e.series||'-')}x${escapeHtml(e.reps||'-')}${e.obs?(' · '+escapeHtml(e.obs)):''}</span></div>`).join('')}
                ${ficha.exercicios.length>4 ? `<div class="planDiaExMais">+${ficha.exercicios.length-4} exercício(s)</div>` : ''}
                <span class="planDiaVerFicha" data-plan-abrir-ficha="${ficha.id}">Ver ficha completa →</span>
              </div>
            ` : ''}
          ` : ''}
        </div>`;
    });
    semanasHtml += `
      <div class="planSemana ${isAtual?'planSemanaAtual':''}">
        <div class="planSemanaLabel">${formatDate(segISO)} a ${formatDate(domISO)}${isAtual?' · atual':''}</div>
        <div class="planSemanaDias">${diasHtml}</div>
      </div>`;
  }
  return `
    <div class="card noprint" style="margin-bottom:18px;">
      <div class="row" style="justify-content:space-between;margin-bottom:10px;">
        <strong style="font-size:13px;">📅 Planejamento semanal</strong>
        <button class="ghost small" id="btnAddSemanaPlanejamento">+ Adicionar semana</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">${semanasHtml}</div>
    </div>
  `;
}

function renderStudentDetail(id){
  const s = db.students.find(x=>x.id===id);
  if(!s){ state.studentId=null; return renderStudentsList(); }
  s.fichas = s.fichas || [];
  s.avaliacoes = s.avaliacoes || [];
  s.divisaoSemanal = s.divisaoSemanal || {};
  const avaliacoes = s.avaliacoes.slice().sort((a,b)=> (b.data||'').localeCompare(a.data||''));
  const avaliacoesAsc = s.avaliacoes.slice().sort((a,b)=> (a.data||'').localeCompare(b.data||''));
  const primeira = avaliacoesAsc[0];
  const ultima = avaliacoes[0];

  const metric = METRICAS_EVOLUCAO.find(m=>m.key===state.chartMetric) || METRICAS_EVOLUCAO[0];
  const chartHtml = s.avaliacoes.length>=2
    ? buildEvolutionChart(avaliacoesAsc, metric.key, metric.unit)
    : '<div class="empty">Registre pelo menos 2 avaliações para ver o gráfico de evolução.</div>';

  const comparePhotosHtml = (primeira && ultima && primeira.id !== ultima.id) ? ['frente','lado','costas'].map(k=>{
    const antes = primeira.fotos && primeira.fotos[k];
    const depois = ultima.fotos && ultima.fotos[k];
    if(!antes || !depois) return '';
    return `
      <div>
        <div class="meta" style="text-transform:capitalize;text-align:center;margin-bottom:6px;">${k}</div>
        <div class="row" style="gap:8px;justify-content:center;">
          <div style="text-align:center;">
            <img src="${antes}" data-view-photo="${escapeAttr(antes)}" class="photoThumb" style="width:120px;height:150px;">
            <div class="meta">Antes • ${formatDate(primeira.data)}</div>
          </div>
          <div style="text-align:center;">
            <img src="${depois}" data-view-photo="${escapeAttr(depois)}" class="photoThumb" style="width:120px;height:150px;">
            <div class="meta">Depois • ${formatDate(ultima.data)}</div>
          </div>
        </div>
      </div>
    `;
  }).join('') : '';
  const avaliacoesHtml = avaliacoes.map((av,i)=>{
    const isBaseline = primeira && av.id === primeira.id;
    const stat = (label,val,unit)=> val ? `<div class="evalStat"><div class="v">${escapeHtml(val)}${unit?('<span style="font-size:11px;color:var(--muted)">'+unit+'</span>'):''}</div><div class="k">${label}</div></div>` : '';
    return `
    <div class="card">
      <div class="evalCard">
        <div style="flex:1;">
          <div class="row" style="margin-bottom:4px;">
            <strong>${formatDate(av.data)}</strong>
            ${isBaseline?'<span class="tag green">AVALIAÇÃO INICIAL</span>':''}
          </div>
          <div class="evalStats">
            ${stat('Idade',av.idade,'anos')}
            ${stat('Peso',av.peso,'kg')}
            ${stat('Altura',av.altura,'cm')}
            ${stat('% Gordura',av.percGordura,'%')}
            ${stat('Pescoço',av.circPescoco,'cm')}
            ${stat('Tórax',av.circPeito,'cm')}
            ${stat('Cintura',av.circCintura,'cm')}
            ${stat('Quadril',av.circQuadril,'cm')}
            ${stat('Abdômen',av.circAbdomen,'cm')}
            ${stat('Braço',av.circBraco,'cm')}
            ${stat('Coxa',av.circCoxa,'cm')}
            ${stat('Panturrilha',av.circPanturrilha,'cm')}
          </div>
          ${['dobraTricipital','dobraBicipital','dobraAbdominal','dobraSubescapular','dobraCoxa','dobraToracica','dobraSuprailiaca','dobraSupraespinhal'].some(k=>av[k]) ? `
          <div class="meta" style="margin-top:6px;margin-bottom:4px;">Dobras cutâneas</div>
          <div class="evalStats">
            ${stat('Tricipital',av.dobraTricipital,'mm')}
            ${stat('Bicipital',av.dobraBicipital,'mm')}
            ${stat('Abdominal',av.dobraAbdominal,'mm')}
            ${stat('Subescapular',av.dobraSubescapular,'mm')}
            ${stat('Coxa',av.dobraCoxa,'mm')}
            ${stat('Torácica',av.dobraToracica,'mm')}
            ${stat('Suprailíaca',av.dobraSuprailiaca,'mm')}
            ${stat('Supraespinhal',av.dobraSupraespinhal,'mm')}
          </div>
          ` : ''}
          ${(av.fotos && (av.fotos.frente||av.fotos.lado||av.fotos.costas)) ? `
            <div class="row" style="margin-top:10px;gap:8px;">
              ${['frente','lado','costas'].map(k=> av.fotos[k] ? `<img src="${av.fotos[k]}" data-view-photo="${escapeAttr(av.fotos[k])}" class="photoThumb" title="${k}">` : '').join('')}
            </div>
          ` : ''}
        </div>
        <div class="row noprint" style="flex-direction:column;align-items:stretch;gap:6px;">
          <button class="ghost small" data-print-aval="${av.id}">🖨️ Imprimir</button>
          <button class="secondary small" data-edit-aval="${av.id}">Editar</button>
          <button class="danger small" data-del-aval="${av.id}">Excluir</button>
        </div>
      </div>
    </div>
  `;}).join('');

  s.cargaLog = s.cargaLog || [];
  const cargaGroups = new Map();
  s.cargaLog.forEach(entry=>{
    const key = entry.exercicio.trim().toLowerCase();
    if(!cargaGroups.has(key)) cargaGroups.set(key, {nome: entry.exercicio, entries: []});
    cargaGroups.get(key).entries.push(entry);
  });
  const cargaHtml = [...cargaGroups.values()].map(group=>{
    const sorted = group.entries.slice().sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    const first = sorted[0], last = sorted[sorted.length-1];
    const numFirst = parseFloat(String(first.carga).replace(',','.'));
    const numLast = parseFloat(String(last.carga).replace(',','.'));
    let deltaHtml = '';
    if(sorted.length>1 && !isNaN(numFirst) && !isNaN(numLast)){
      const diff = numLast - numFirst;
      const color = diff>0?'var(--green)':(diff<0?'var(--red)':'var(--muted)');
      const arrow = diff>0?'▲':(diff<0?'▼':'—');
      deltaHtml = `<span style="color:${color};font-weight:700;font-size:13px;">${arrow} ${diff>0?'+':''}${diff.toFixed(1)} desde ${formatDate(first.data)}</span>`;
    }
    const rows = sorted.slice().reverse().map(e=>`
      <tr>
        <td>${formatDate(e.data)}</td>
        <td>${escapeHtml(e.carga)}</td>
        <td>${escapeHtml(e.reps||'-')}</td>
        <td>${escapeHtml(e.obs||'-')}</td>
        <td class="noprint">
          <button class="secondary small" data-edit-carga="${e.id}">Editar</button>
          <button class="danger small" data-del-carga="${e.id}">✕</button>
        </td>
      </tr>
    `).join('');
    return `
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px;">
          <strong>${escapeHtml(group.nome)}</strong>
          ${deltaHtml}
        </div>
        <table>
          <thead><tr><th>Data</th><th>Carga</th><th>Reps</th><th>Obs</th><th class="noprint"></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }).join('');

  const fichaIdHoje = fichaIdParaData(s, isoHoje());
  const fichas = s.fichas.slice().sort((a,b)=> (b.criadoEm||'').localeCompare(a.criadoEm||''));
  const fichasVisiveis = fichas.filter(f=>f.ativa);
  const fichasArquivadasList = fichas.filter(f=>!f.ativa);
  const buildFichaCard = f=>{
    const total = f.exercicios.length;
    const feitos = f.exercicios.filter(e=>e.feito).length;
    const ehFichaDeHoje = f.id === fichaIdHoje;
    const linhasExercicios = f.exercicios.map((e,idxEx)=>{
      const anteriorEx = f.exercicios[idxEx-1];
      const destacadoEx = e.encadeado || (anteriorEx && anteriorEx.encadeado);
      return `<tr style="${destacadoEx?'background:var(--panel2);border-left:3px solid var(--accent);':''}">
            <td class="noprint"><input type="checkbox" data-toggle-exec="${f.id}|${e.id}" ${e.feito?'checked':''} style="width:18px;height:18px;cursor:pointer;"></td>
            <td style="${e.feito?'text-decoration:line-through;color:var(--muted);':''}">${escapeHtml(e.nome)} ${e.video?`<a href="${escapeAttr(e.video)}" target="_blank" rel="noopener" class="noprint" title="Ver vídeo de execução" style="text-decoration:none;">🎥</a>`:''}</td>
            <td>${escapeHtml(e.grupo||'-')}</td>
            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|series" value="${escapeAttr(e.series||'')}" placeholder="-"></td>
            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|reps" value="${escapeAttr(e.reps||'')}" placeholder="-"></td>
            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|obs" value="${escapeAttr(e.obs||'')}" placeholder="-"></td>
            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|descanso" value="${escapeAttr(e.descanso||'')}" placeholder="Ex: 60s"></td>
            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|metodo" value="${escapeAttr(e.metodo||'')}" placeholder="Ex: Bi-set"></td>
            <td class="noprint"><input type="checkbox" data-toggle-encadeado="${f.id}|${e.id}" ${e.encadeado?'checked':''} title="Encadear com o próximo (sem descanso)" style="width:18px;height:18px;cursor:pointer;"></td>
            <td id="vol-${f.id}-${e.id}" style="color:var(--muted);">${formatVolume(calcularVolumeExercicio(e))}</td>
            <td>
              <button type="button" class="secondary small noprint" data-open-note="${f.id}|${e.id}" style="${e.notas?'border-color:var(--yellow);color:var(--yellow);':''}">${e.notas?'📝 Ver observação':'📝 Observação'}</button>
              <span class="onlyPrint">${escapeHtml(e.notas||'-')}</span>
            </td>
          </tr>`;
    }).join('');
    return `
    <div class="card" style="${ehFichaDeHoje?'border-color:var(--accent);':''}">
      <div class="fichaHeader">
        <div class="row">
          <div class="fichaTag">${escapeHtml(f.letra)}</div>
          <div>
            <div style="font-weight:600;">${escapeHtml(f.nome||('Treino '+f.letra))}</div>
            <div class="meta" style="color:var(--muted);font-size:12px;">${total} exercício(s) • criado em ${formatDate(f.criadoEm)}</div>
          </div>
          <span class="tag ${f.ativa?'green':'gray'}">${f.ativa?'ATIVA':'ARQUIVADA'}</span>
          <span class="tag ${feitos===total && total>0 ?'green':'gray'}">${feitos}/${total} concluído(s)</span>
          <span class="tag gray" id="volTotal-${f.id}">🏋️ Volume: ${formatVolume(volumeTotalFicha(f))}kg</span>
          ${ehFichaDeHoje ? `<span class="tag" style="background:var(--accent);color:#fff;">📅 Ficha de hoje</span>` : ''}
        </div>
        <div class="row noprint">
          ${f.ativa ? `<button class="small" data-live-start="${f.id}">▶️ Iniciar treino</button>` : ''}
          ${(feitos===total && total>0) ? `<button class="small" style="background:var(--green);" data-resumo-treino="${f.id}">Enviar resumo pro aluno</button>` : ''}
          <button class="secondary small" data-edit-ficha="${f.id}">Editar</button>
          <button class="ghost small" data-duplicate-ficha="${f.id}">Duplicar / Alternar</button>
          ${s.fichas.length>1 ? `<button class="ghost small" data-compare-ficha="${f.id}">🔀 Comparar</button>` : ''}
          <button class="secondary small" data-toggle-ficha="${f.id}">${f.ativa?'Arquivar':'Reativar'}</button>
          <button class="secondary small" data-reset-checks="${f.id}">Resetar marcações</button>
          <button class="ghost small" data-print-ficha="${f.id}">🖨️ Imprimir ficha</button>
          <button class="danger small" data-del-ficha="${f.id}">Excluir</button>
        </div>
      </div>
      <table>
        <thead><tr><th class="noprint">Feito</th><th>Exercício</th><th>Grupo</th><th>Séries</th><th>Reps</th><th>Carga</th><th>Descanso</th><th>Método</th><th class="noprint" title="Encadear com o próximo, sem descanso">🔗</th><th title="Séries x Reps x Carga">Volume</th><th>Anotações</th></tr></thead>
        <tbody>
          ${linhasExercicios}
        </tbody>
      </table>
    </div>
  `;};
  const fichasHtml = fichasVisiveis.map(buildFichaCard).join('');
  const fichasArquivadasHtml = fichasArquivadasList.map(buildFichaCard).join('');

  return `
    <span class="backBtn noprint" id="backToStudents">&larr; Voltar para Alunos</span>
    <h2>${escapeHtml(s.nome)} ${(s.status||'ativo')==='pausado'?'<span class="tag gray">PAUSADO</span>':''} <span class="tag ${statusPagamentoClass(statusPagamentoAluno(s).status)}">${statusPagamentoLabel(statusPagamentoAluno(s).status)}</span></h2>
    <div class="sub">${escapeHtml(s.objetivo||'')} ${s.nivel? ' • Nível: '+escapeHtml(s.nivel):''} ${s.whatsapp?` • <a href="${whatsappLink(s.whatsapp)}" target="_blank" rel="noopener" style="color:var(--green);text-decoration:none;">💬 ${escapeHtml(s.whatsapp)}</a>`:''}</div>
    <div class="row noprint" style="margin-bottom:18px;">
      <button id="btnNewFicha">+ Nova ficha de treino</button>
      <button class="secondary" id="btnEditStudent">Editar aluno</button>
      <button class="secondary" id="btnToggleStatus">${(s.status||'ativo')==='pausado'?'Reativar aluno':'Pausar aluno'}</button>
      <button class="secondary" id="btnPagamento">💳 Pagamento</button>
      ${s.whatsapp?`<button class="ghost" onclick="window.open('${whatsappLink(s.whatsapp)}','_blank')">💬 Chamar no WhatsApp</button>`:''}
      <button class="ghost" onclick="window.print()">Imprimir / Exportar PDF</button>
      <button class="ghost" id="btnFichasArquivadas">Fichas arquivadas (${fichasArquivadasList.length})</button>
      <button class="danger" id="btnDelStudent">Excluir aluno</button>
    </div>

    ${buildPlanejamentoHtml(s)}

    <div class="sectionTitle">
      <span class="collapseToggle" data-toggle-section="anamnese"><span class="collapseArrow">${state.collapsedSections.anamnese?'▶':'▼'}</span> 🩺 Anamnese completa</span>
      <button class="secondary small noprint" id="btnEditAnamnese" style="margin-left:auto;">${anamneseRespondida(s)?'Editar anamnese':'+ Preencher anamnese'}</button>
    </div>
    <div class="collapsibleContent" style="display:${state.collapsedSections.anamnese?'none':'block'};">
      ${anamneseRespondida(s) ? `
        <div class="card" style="overflow-x:auto;">
          <table style="min-width:480px;">
            <tbody>${buildAnamneseTable(s)}</tbody>
          </table>
          ${s.anamneseObservacoes ? `<div style="font-weight:600;margin-top:14px;margin-bottom:6px;">Observações gerais</div><div class="anamneseBox">${escapeHtml(s.anamneseObservacoes)}</div>` : ''}
        </div>
      ` : '<div class="empty">Nenhuma anamnese preenchida ainda. Clique em "+ Preencher anamnese" para registrar o histórico de saúde e hábitos de vida do aluno.</div>'}
    </div>

    <div class="sectionTitle">
      <span class="collapseToggle" data-toggle-section="evolucao"><span class="collapseArrow">${state.collapsedSections.evolucao?'▶':'▼'}</span> 📊 Evolução</span>
      <select id="chartMetricSelect" class="noprint" style="margin-left:auto;">
        ${METRICAS_EVOLUCAO.map(m=>`<option value="${m.key}" ${m.key===metric.key?'selected':''}>${m.label}</option>`).join('')}
      </select>
    </div>
    <div class="collapsibleContent" style="display:${state.collapsedSections.evolucao?'none':'block'};">
      <div class="card">${chartHtml}</div>
      ${buildComparisonTable(avaliacoesAsc)}
      ${comparePhotosHtml ? `
        <div class="card">
          <div style="font-weight:600;margin-bottom:10px;">📸 Antes x Depois</div>
          <div class="row" style="gap:24px;justify-content:flex-start;">${comparePhotosHtml}</div>
        </div>
      ` : ''}
    </div>

    <div class="sectionTitle">
      <span class="collapseToggle" data-toggle-section="avaliacoes"><span class="collapseArrow">${state.collapsedSections.avaliacoes?'▶':'▼'}</span> 📋 Avaliação física</span>
      <button class="secondary small noprint" id="btnNewAval" style="margin-left:auto;">+ Nova avaliação</button>
    </div>
    ${(()=>{ const r = reavaliacaoStatus(s); if(!r || !r.atrasada) return ''; const msg = r.motivo==='nunca' ? 'Este aluno ainda não tem nenhuma avaliação física registrada.' : `Já se passaram ${r.dias} dias desde a última avaliação (limite recomendado: ${REAVAL_DIAS_LIMITE} dias).`; return `<div class="banner noprint">⏰ ${msg}</div>`; })()}
    <div class="collapsibleContent" style="display:${state.collapsedSections.avaliacoes?'none':'block'};">
      ${avaliacoesHtml || '<div class="empty">Nenhuma avaliação registrada. Clique em "+ Nova avaliação" para lançar peso, altura, circunferências e anamnese inicial.</div>'}
    </div>

    <div class="sectionTitle">
      <span class="collapseToggle" data-toggle-section="fichas"><span class="collapseArrow">${state.collapsedSections.fichas?'▶':'▼'}</span> 🏋️ Fichas de treino</span>
      ${fichas.length>0 ? `<span class="tag gray" id="volTotalAluno" style="margin-left:auto;">🏋️ Volume total (todas as fichas): ${formatVolume(fichas.reduce((sum,f)=>sum+volumeTotalFicha(f),0))}kg</span>` : ''}
    </div>
    <div class="collapsibleContent" style="display:${state.collapsedSections.fichas?'none':'block'};">
      ${fichasHtml || '<div class="empty">Nenhuma ficha ativa para este aluno. Crie uma nova ou veja as fichas arquivadas.</div>'}
    </div>

    <div class="sectionTitle">
      <span class="collapseToggle" data-toggle-section="cargas"><span class="collapseArrow">${state.collapsedSections.cargas?'▶':'▼'}</span> 📈 Histórico de carga</span>
      <button class="secondary small noprint" id="btnNewCarga" style="margin-left:auto;">+ Registrar carga</button>
    </div>
    <div class="collapsibleContent" style="display:${state.collapsedSections.cargas?'none':'block'};">
      ${cargaHtml || '<div class="empty">Nenhum registro de carga ainda. Use isso para acompanhar a evolução do aluno exercício a exercício.</div>'}
    </div>
  `;
}

function exerciseRowHtml(e){
  return `
    <tr>
      <td>${escapeHtml(e.nome)}</td>
      <td>${escapeHtml(e.series)}</td>
      <td>${escapeHtml(e.reps)}</td>
      <td>${escapeHtml(e.obs||'-')}</td>
      <td>${e.video ? `<a href="${escapeAttr(e.video)}" target="_blank" rel="noopener" class="ghost small" style="text-decoration:none;display:inline-block;padding:5px 10px;border-radius:7px;">🎥 Ver vídeo</a>` : '-'}</td>
      <td class="noprint">

        <button class="danger small" data-del-ex="${e.id}">Excluir</button>

function filteredExercises(){
  const term = (state.exerciseSearch||'').trim().toLowerCase();
  if(!term) return db.exercises;
  return db.exercises.filter(e=>
    (e.nome||'').toLowerCase().includes(term) ||
    (e.grupo||'').toLowerCase().includes(term)
  );
}
function grupoExercicioColapsado(grupo){
  return state.exerciseCollapsedGroups[grupo] !== false; // padrão: fechado, só abre se explicitamente marcado
}
function exerciseGroupsHtml(){
  const filtered = filteredExercises();
  const term = (state.exerciseSearch||'').trim();
  const grupos = [...new Set(db.exercises.map(e=>e.grupo||'Sem grupo'))].sort();
  const html = grupos.map(grupo=>{
    const exs = filtered.filter(e=>(e.grupo||'Sem grupo')===grupo);
    if(exs.length===0) return '';
    const colapsado = term ? false : grupoExercicioColapsado(grupo);
    return `
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:12px;">
        <div class="sectionTitle noprint" style="margin:0;padding:14px 18px;cursor:pointer;" data-toggle-ex-group="${escapeAttr(grupo)}">
          <span class="collapseToggle"><span class="collapseArrow">${colapsado?'▶':'▼'}</span> ${escapeHtml(grupo)}</span>
          <span class="tag gray" style="margin-left:auto;">${exs.length} exercício(s)</span>
        </div>
        <div class="collapsibleContent" style="display:${colapsado?'none':'block'};padding:0 18px 16px;">
          <table>

// ---------- BACKUP ----------
function renderBackup(){
  const totalFichas = db.students.reduce((n,s)=>n+(s.fichas||[]).length,0);
  const totalAval = db.students.reduce((n,s)=>n+(s.avaliacoes||[]).length,0);
  const totalCargas = db.students.reduce((n,s)=>n+(s.cargaLog||[]).length,0);
  const totalFotos = db.students.reduce((n,s)=>n+(s.avaliacoes||[]).reduce((m,av)=> m + (av.fotos ? Object.values(av.fotos).filter(Boolean).length : 0), 0), 0);
  const sizeBytes = new Blob([JSON.stringify(db)]).size;
  const sizeLabel = sizeBytes > 1024*1024 ? (sizeBytes/1024/1024).toFixed(1)+' MB' : (sizeBytes/1024).toFixed(0)+' KB';
  return `
    <h2>Backup dos dados</h2>
    <div class="sub">Todos os dados ficam salvos apenas neste navegador. Exporte um backup regularmente para não perder nada ao trocar de computador, limpar o cache ou reinstalar o navegador.</div>
    <div class="card">
      <div class="evalStats" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));">
        <div class="evalStat"><div class="v">${db.students.length}</div><div class="k">Alunos</div></div>
        <div class="evalStat"><div class="v">${totalFichas}</div><div class="k">Fichas</div></div>
        <div class="evalStat"><div class="v">${totalAval}</div><div class="k">Avaliações</div></div>
        <div class="evalStat"><div class="v">${totalCargas}</div><div class="k">Registros de carga</div></div>
        <div class="evalStat"><div class="v">${totalFotos}</div><div class="k">Fotos</div></div>
        <div class="evalStat"><div class="v">${db.exercises.length}</div><div class="k">Exercícios</div></div>
        <div class="evalStat"><div class="v">${sizeLabel}</div><div class="k">Tamanho total</div></div>
      </div>
    </div>
    <div class="card noprint">
      <div style="font-weight:600;margin-bottom:8px;">Exportar backup</div>
      <div class="meta" style="margin-bottom:12px;">Gera um arquivo .json com todos os alunos, fichas, avaliações e o banco de exercícios.</div>
      ${(()=>{ const b = backupStatus(); const cor = b.atrasado ? 'var(--yellow)' : 'var(--green)'; const msg = b.nunca ? 'Nenhum backup exportado ainda.' : (b.atrasado ? `Último backup há ${b.dias} dia(s) — recomendado exportar a cada ${BACKUP_DIAS_LIMITE} dias.` : `Último backup há ${b.dias} dia(s). Tudo em dia.`); return `<div class="meta" style="margin-bottom:12px;color:${cor};font-weight:600;">${b.atrasado?'⚠️':'✅'} ${msg}</div>`; })()}
      <button id="btnExportBackup">⬇ Baixar backup (.json)</button>
    </div>
    <div class="card noprint">
      <div style="font-weight:600;margin-bottom:8px;">Importar / Restaurar backup</div>
      <div class="meta" style="margin-bottom:12px;">Selecione um arquivo .json exportado anteriormente. Isso <strong>substitui</strong> todos os dados atuais deste navegador.</div>
      <input type="file" id="inputImportBackup" accept="application/json,.json">
    </div>
  `;
}

function exportBackup(){
  const payload = { ...db, exportadoEm: new Date().toISOString(), versao: 1 };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `fitpro-backup-${dataStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  try{ URL.revokeObjectURL(url); }catch(e){}
  registrarBackupFeito();
  render();
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.students) || !Array.isArray(parsed.exercises)){
        showToast('Arquivo inválido: não parece ser um backup do FitPro Manager.', 'error');
        return;
      }
      showConfirm('Isso vai SUBSTITUIR todos os dados atuais por este backup. Deseja continuar?', ()=>{
        db = { students: parsed.students, exercises: parsed.exercises, bloqueios: parsed.bloqueios||[], lixeiraAlunos: parsed.lixeiraAlunos||[] };
        saveDB();
        localStorage.setItem(MIGR_KEY, '1');
        showToast('Backup restaurado com sucesso.', 'success');
        render();
      }, {danger:true, confirmLabel:'Restaurar'});
    } catch(e){
      showToast('Não foi possível ler o arquivo. Verifique se é um backup .json válido.', 'error');
    }
  };
  reader.readAsText(file);
}

    };
  });
  document.querySelectorAll('[data-resumo-treino]').forEach(el=>{
    el.onclick = ()=> openResumoTreinoModal(state.studentId, el.dataset.resumoTreino);
  });
  const sairTreinoAoVivo = document.getElementById('sairTreinoAoVivo');
  if(sairTreinoAoVivo) sairTreinoAoVivo.onclick = ()=>{ state.treinoAoVivo = null; render(); };
  document.querySelectorAll('[data-live-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const [fichaId, execId] = el.dataset.liveToggle.split('|');
      const s = db.students.find(x=>x.id===state.treinoAoVivo.studentId);
      const f = s.fichas.find(x=>x.id===fichaId);
      const ex = f.exercicios.find(x=>x.id===execId);
      ex.feito = !ex.feito;
      saveDB(); render();
    };
  });
  document.querySelectorAll('[data-live-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const [fichaId, execId, field] = el.dataset.liveField.split('|');
      const s = db.students.find(x=>x.id===state.treinoAoVivo.studentId);
      const f = s.fichas.find(x=>x.id===fichaId);
      const ex = f.exercicios.find(x=>x.id===execId);
      ex[field] = el.value;
      saveDB();
    });
  });
  const backFromRecibo = document.getElementById('backFromRecibo');
  if(backFromRecibo) backFromRecibo.onclick = ()=>{
    state.printRecibo = null;
    state.tab = 'pagamentos';
    document.querySelectorAll('nav .tab').forEach(x=>x.classList.remove('active'));
    const tabEl = document.querySelector('nav .tab[data-tab="pagamentos"]');
    if(tabEl) tabEl.classList.add('active');
    render();
  };
  const backFromAvaliacao = document.getElementById('backFromAvaliacao');
  if(backFromAvaliacao) backFromAvaliacao.onclick = ()=>{ state.printAvaliacao = null; render(); };
  document.querySelectorAll('[data-del-ficha]').forEach(el=>{
    el.onclick = ()=>{
      showConfirm('Excluir esta ficha?', ()=>{
        const s = db.students.find(x=>x.id===state.studentId);
        const idx = s.fichas.findIndex(x=>x.id===el.dataset.delFicha);
        const removida = s.fichas[idx];
        s.fichas.splice(idx,1);
        saveDB(); render();
        showToastDesfazer('Ficha excluída.', ()=>{
          const s2 = db.students.find(x=>x.id===state.studentId);
          s2.fichas.splice(idx,0,removida);
          saveDB(); render();
        });
      }, {danger:true, confirmLabel:'Excluir'});
    };
  });

  const btnAddEx = document.getElementById('btnAddEx');
  if(btnAddEx) btnAddEx.onclick = ()=> openExerciseModal();

  const btnImportLib = document.getElementById('btnImportLib');
  if(btnImportLib) btnImportLib.onclick = ()=>{
    const existing = new Set(db.exercises.map(e=>e.nome.trim().toLowerCase()));
    const toAdd = defaultExerciseLibrary().filter(e=>!existing.has(e.nome.trim().toLowerCase()));
    if(toAdd.length===0){ showToast('Sua biblioteca já tem todos os exercícios padrão.', 'info'); return; }
    db.exercises = db.exercises.concat(toAdd);
    saveDB(); render();
    showToast(toAdd.length + ' exercício(s) novo(s) adicionado(s) à biblioteca.', 'success');
  };
  bindExerciseRowEvents();

  const exSearchInput = document.getElementById('exSearchInput');
  if(exSearchInput) exSearchInput.oninput = ()=>{
    state.exerciseSearch = exSearchInput.value;
    renderExerciseRows();
  };
}

const PERGUNTAS_RESUMO_TREINO = [
  { chave:'desempenho', label:'Desempenho geral do aluno hoje?', prefixo:'Desempenho', opcoes:['Excelente','Bom','Regular'] },
  { chave:'esforco', label:'Nível de esforço aplicado?', prefixo:'Esforço', opcoes:['Alto','Moderado','Leve'] },
  { chave:'evolucao', label:'Evolução em relação ao treino anterior?', prefixo:'Evolução', opcoes:['Evoluiu','Manteve o nível','Precisa ajustar'] },
];

function openResumoTreinoModal(studentId, fichaId){
  const s = db.students.find(x=>x.id===studentId);
  const f = s && s.fichas.find(x=>x.id===fichaId);
  if(!s || !f) return;
  const nomeFicha = f.nome || ('Treino '+f.letra);
  const escolhas = {};
  PERGUNTAS_RESUMO_TREINO.forEach(p=> escolhas[p.chave] = p.opcoes[0]);

  function montarMensagem(){
    const linhas = PERGUNTAS_RESUMO_TREINO.map(p=> `${p.prefixo}: ${escolhas[p.chave]}`);
    return `Oi ${s.nome}! Você concluiu o ${nomeFicha} hoje.\n${linhas.join('\n')}\nContinue assim!`;
  }

  const avisoWhatsapp = !s.whatsapp ? `<div class="meta" style="color:var(--yellow);margin-bottom:12px;">Cadastre o WhatsApp do aluno em "Editar aluno" para poder enviar.</div>` : '';

  openModal(`
    <h3>Resumo do treino</h3>
    <div class="meta" style="margin-bottom:14px;">${escapeHtml(nomeFicha)} concluído • ${escapeHtml(s.nome)}</div>
    ${avisoWhatsapp}
    ${PERGUNTAS_RESUMO_TREINO.map(p=>`
      <div class="field">
        <label>${escapeHtml(p.label)}</label>
        <div class="row" style="gap:6px;flex-wrap:nowrap;">
          ${p.opcoes.map((op,i)=>`<button type="button" class="small resumoOpt" data-resumo-pergunta="${p.chave}" data-resumo-opcao="${escapeAttr(op)}" style="flex:1;${i===0?'border-color:var(--green);color:var(--green);':'background:var(--panel2);color:var(--text);border:1px solid var(--line);'}">${escapeHtml(op)}</button>`).join('')}
        </div>
      </div>
    `).join('')}
    <div class="field">
      <label>Prévia da mensagem (edite se quiser adicionar algo)</label>
      <textarea id="resumoPreview" rows="6">${escapeHtml(montarMensagem())}</textarea>
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button id="resumoEnviar" ${!s.whatsapp?'disabled style="opacity:.5;cursor:not-allowed;"':''}>Enviar no WhatsApp</button>
    </div>
  `);

  document.querySelectorAll('.resumoOpt').forEach(btn=>{
    btn.onclick = ()=>{
      const pergunta = btn.dataset.resumoPergunta;
      escolhas[pergunta] = btn.dataset.resumoOpcao;
      document.querySelectorAll(`.resumoOpt[data-resumo-pergunta="${pergunta}"]`).forEach(b=>{
        const selecionado = b === btn;
        b.style.background = 'var(--panel2)';
        b.style.color = selecionado ? 'var(--green)' : 'var(--text)';
        b.style.border = selecionado ? '1px solid var(--green)' : '1px solid var(--line)';
      });
      document.getElementById('resumoPreview').value = montarMensagem();
    };
  });

  const resumoEnviar = document.getElementById('resumoEnviar');
  if(resumoEnviar) resumoEnviar.onclick = ()=>{
    if(!s.whatsapp) return;
    const mensagemFinal = document.getElementById('resumoPreview').value;
    window.open(whatsappLink(s.whatsapp, mensagemFinal), '_blank');
    closeModal();
  };
}

// ---------- TOAST / CONFIRMAÇÃO (substituem alert()/confirm() nativos) ----------
function showToast(message, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = message;
  container.appendChild(el);
  const raf = (typeof window !== 'undefined' && window.requestAnimationFrame) ? window.requestAnimationFrame.bind(window) : (cb)=>setTimeout(cb,16);
  raf(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  }, 3400);
}
function showToastDesfazer(message, onDesfazer){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast toast-info';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'space-between';
  el.style.gap = '10px';
  el.innerHTML = `<span>${escapeHtml(message)}</span><button class="ghost small" style="flex-shrink:0;">Desfazer</button>`;
  container.appendChild(el);
  const raf = (typeof window !== 'undefined' && window.requestAnimationFrame) ? window.requestAnimationFrame.bind(window) : (cb)=>setTimeout(cb,16);
  raf(()=> el.classList.add('show'));
  let desfeito = false;
  const remover = ()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  };
  el.querySelector('button').onclick = ()=>{
    if(desfeito) return;
    desfeito = true;
    onDesfazer();
    remover();
  };
  setTimeout(()=>{ if(!desfeito) remover(); }, 8000);
}
function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  openModal(`
    <h3 style="margin-bottom:10px;">${opts.title ? escapeHtml(opts.title) : 'Confirmar ação'}</h3>
    <div style="margin-bottom:18px;color:var(--text);font-size:14px;">${escapeHtml(message)}</div>
    <div class="actions">
      <button class="secondary" id="confirmCancelBtn">Cancelar</button>
      <button class="${opts.danger?'danger':''}" id="confirmActionBtn">${escapeHtml(opts.confirmLabel||'Confirmar')}</button>
    </div>
  `);
  document.getElementById('confirmCancelBtn').onclick = ()=>{
    closeModal();
    if(opts.onCancel) opts.onCancel();
  };
  document.getElementById('confirmActionBtn').onclick = ()=>{
    closeModal();
    onConfirm();
  };
}

    </div>
    <div class="sectionTitle" style="font-size:14px;margin:16px 0 8px;">📏 Dobras cutâneas <span style="color:var(--muted);font-weight:400;font-size:12px;">(protocolo de 7 dobras, opcional)</span></div>
    <div class="measureGrid">
      <div class="field"><label>Tricipital (mm)</label><input id="avDobraTricipital" value="${editing?escapeAttr(av.dobraTricipital||''):''}"></div>
      <div class="field"><label>Bicipital (mm)</label><input id="avDobraBicipital" value="${editing?escapeAttr(av.dobraBicipital||''):''}"></div>
      <div class="field"><label>Abdominal (mm)</label><input id="avDobraAbdominal" value="${editing?escapeAttr(av.dobraAbdominal||''):''}"></div>
      <div class="field"><label>Subescapular (mm)</label><input id="avDobraSubescapular" value="${editing?escapeAttr(av.dobraSubescapular||''):''}"></div>
      <div class="field"><label>Coxa (mm)</label><input id="avDobraCoxa" value="${editing?escapeAttr(av.dobraCoxa||''):''}"></div>
      <div class="field"><label>Torácica (mm)</label><input id="avDobraToracica" value="${editing?escapeAttr(av.dobraToracica||''):''}"></div>
      <div class="field"><label>Suprailíaca (mm)</label><input id="avDobraSuprailiaca" value="${editing?escapeAttr(av.dobraSuprailiaca||''):''}"></div>
      <div class="field"><label>Supraespinhal (mm)</label><input id="avDobraSupraespinhal" value="${editing?escapeAttr(av.dobraSupraespinhal||''):''}"></div>
    </div>
    <div class="anamneseBox" style="margin-top:-4px;margin-bottom:10px;font-size:12px;">
      ⚠️ O % de gordura é uma <strong>estimativa</strong> pelo método US Navy (fita métrica), com margem de erro de aproximadamente 3-4% em relação a exames de laboratório (DEXA), e tende a errar mais em pessoas muito magras ou muito musculosas. Se você tiver adipômetro, bioimpedância ou outro equipamento próprio, digite o valor real por cima — o campo é totalmente editável e seu valor não será sobrescrito sozinho.
    </div>
    <div class="meta" id="avGorduraHint" style="margin-top:-4px;margin-bottom:10px;"></div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button id="avSave">Salvar avaliação</button>
    </div>
  `);

  let manualOverride = false;
  function recalcularGordura(force){
    const hint = document.getElementById('avGorduraHint');
    if(manualOverride && !force){
      hint.textContent = 'Valor digitado manualmente — não será sobrescrito automaticamente. Clique em 🔄 para recalcular pela fórmula.';
      hint.style.color = 'var(--muted)';
      return;
    }
    const alturaCm = parseFloat(document.getElementById('avAltura').value.replace(',','.'));
    const cintura = parseFloat(document.getElementById('avCintura').value.replace(',','.'));
    const pescoco = parseFloat(document.getElementById('avPescoco').value.replace(',','.'));
    const quadril = parseFloat(document.getElementById('avQuadril').value.replace(',','.'));
    if(!s.sexo){
      hint.textContent = 'Defina o sexo do aluno em "Editar aluno" para habilitar o cálculo automático.';
      hint.style.color = 'var(--yellow)';
      return;
    }
    const faltando = [];
    if(isNaN(alturaCm)||alturaCm<=0) faltando.push('altura');
    if(isNaN(cintura)||cintura<=0) faltando.push('cintura');
    if(isNaN(pescoco)||pescoco<=0) faltando.push('pescoço');
    if(s.sexo==='F' && (isNaN(quadril)||quadril<=0)) faltando.push('quadril');
    if(faltando.length){
      hint.textContent = `Preencha ${faltando.join(', ')} para calcular a % de gordura automaticamente (método US Navy, por fita métrica).`;
      hint.style.color = 'var(--muted)';
      return;
    }
    let gordura;
    if(s.sexo === 'M'){
      if(cintura <= pescoco){
        hint.textContent = 'A medida da cintura precisa ser maior que a do pescoço para calcular.';
        hint.style.color = 'var(--yellow)';
        return;
      }
      gordura = 495 / (1.0324 - 0.19077*Math.log10(cintura-pescoco) + 0.15456*Math.log10(alturaCm)) - 450;
    } else {
      if((cintura+quadril) <= pescoco){
        hint.textContent = 'As medidas informadas não são válidas para o cálculo.';
        hint.style.color = 'var(--yellow)';
        return;
      }
      gordura = 495 / (1.29579 - 0.35004*Math.log10(cintura+quadril-pescoco) + 0.22100*Math.log10(alturaCm)) - 450;
    }
    const gorduraFinal = Math.max(gordura, 0).toFixed(1);
    document.getElementById('avPercGordura').value = gorduraFinal;
    manualOverride = false;
    hint.textContent = 'Estimativa calculada (método US Navy, por fita métrica: cintura, pescoço' + (s.sexo==='F'?', quadril':'') + ' e altura). Digite por cima a qualquer momento se tiver uma medição real.';
    hint.style.color = 'var(--green)';
  }
  ['avAltura','avCintura','avPescoco','avQuadril'].forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>recalcularGordura(false));
  });
  document.getElementById('avPercGordura').addEventListener('input', ()=>{ manualOverride = true; });
  document.getElementById('avRecalcBtn').addEventListener('click', ()=>{ manualOverride = false; recalcularGordura(true); });
  // Se já existir um valor salvo (edição), tratamos como possível valor manual e não sobrescrevemos de imediato.
  if(editing && av.percGordura){ manualOverride = true; }
  recalcularGordura(false);

  document.getElementById('avSave').onclick = ()=>{
    const data = document.getElementById('avData').value || today;
    // Upload de novas fotos está desativado nesta fase; preserva fotos já existentes (edição), se houver.
    const fotos = (editing && av.fotos) ? av.fotos : {};
    const payload = {
      data,
      idade: document.getElementById('avIdade').value.trim(),
      peso: document.getElementById('avPeso').value.trim(),
      altura: document.getElementById('avAltura').value.trim(),
      percGordura: document.getElementById('avPercGordura').value.trim(),
      circPescoco: document.getElementById('avPescoco').value.trim(),
      circPeito: document.getElementById('avPeito').value.trim(),
      circCintura: document.getElementById('avCintura').value.trim(),
      circQuadril: document.getElementById('avQuadril').value.trim(),
      circAbdomen: document.getElementById('avAbdomen').value.trim(),
      circBraco: document.getElementById('avBraco').value.trim(),
      circCoxa: document.getElementById('avCoxa').value.trim(),
      circPanturrilha: document.getElementById('avPanturrilha').value.trim(),
      dobraTricipital: document.getElementById('avDobraTricipital').value.trim(),
      dobraBicipital: document.getElementById('avDobraBicipital').value.trim(),
      dobraAbdominal: document.getElementById('avDobraAbdominal').value.trim(),
      dobraSubescapular: document.getElementById('avDobraSubescapular').value.trim(),
      dobraCoxa: document.getElementById('avDobraCoxa').value.trim(),
      dobraToracica: document.getElementById('avDobraToracica').value.trim(),
      dobraSuprailiaca: document.getElementById('avDobraSuprailiaca').value.trim(),
      dobraSupraespinhal: document.getElementById('avDobraSupraespinhal').value.trim(),
      fotos,
    };
    if(editing){
      Object.assign(av, payload);
    } else {
      s.avaliacoes = s.avaliacoes || [];
      s.avaliacoes.push({id:uid(), ...payload});
    }
    saveDB(); closeModal(); render();
  };
}

  const others = s.fichas.filter(f=>f.id!==fichaA.id).slice().sort((a,b)=> (b.criadoEm||'').localeCompare(a.criadoEm||''));
  if(others.length===0){ showToast('Este aluno só tem uma ficha, não há outra para comparar.', 'info'); return; }
  document.getElementById('modalBody').classList.add('wide');
  openModal(`
    <h3 style="margin-bottom:10px;">Comparar fichas — ${escapeHtml(s.nome)}</h3>
    <div class="field"><label>Comparar "${escapeHtml(fichaA.nome||('Treino '+fichaA.letra))}" com:</label>
      <select id="compareSelect">
        ${others.map(f=>`<option value="${f.id}">${escapeHtml(f.nome||('Treino '+f.letra))} (${f.ativa?'ativa':'arquivada'})</option>`).join('')}
      </select>
    </div>
    <div class="row" style="align-items:flex-start;gap:16px;margin-top:14px;">
      <div class="compareCol">${compareTableHtml(fichaA)}</div>
      <div class="compareCol" id="compareColB">${compareTableHtml(others[0])}</div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Fechar</button>
    </div>
  `);
  document.getElementById('compareSelect').onchange = (e)=>{
    const fB = s.fichas.find(x=>x.id===e.target.value);
    document.getElementById('compareColB').innerHTML = compareTableHtml(fB);
  };
}

          <div class="miniField"><label>Descanso</label><input class="rDescanso" placeholder="Ex: 60s" value="${escapeAttr(e.descanso||'')}"></div>

      <label>Começar de um modelo (opcional)</label>
      <select id="fTemplate">
        <option value="">Em branco</option>
        ${Object.entries(TEMPLATES_FICHA).map(([key,t])=>`<option value="${key}">${escapeHtml(t.label)}</option>`).join('')}
      </select>
      <div class="meta">O modelo só preenche exercício e grupo — séries, reps e carga continuam em branco pra você digitar.</div>
    </div>
    ` : ''}
    <div class="row">

    <div class="actions">

  function bindRowRemovals(){
    document.querySelectorAll('#exList [data-rm]').forEach(btn=>{
      btn.onclick = ()=>{ workingList.splice(Number(btn.dataset.rm),1); refreshRows(); };
    });

      sel.onchange = ()=>{

  };

// ---------- IMAGE HELPERS ----------
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- HELPERS ----------
function nextLetter(existing){
  const letters = 'ABCDEFGH';
  for(const l of letters){ if(!existing.includes(l)) return l; }
  return 'X';
}
function formatDate(iso){
  if(!iso) return '-';
  // Datas "apenas dia" (YYYY-MM-DD, sem hora) são interpretadas como meia-noite UTC pelo Date nativo,
  // o que pode "voltar" um dia ao converter para o fuso local. Forçamos meia-noite local nesse caso.
  const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso+'T00:00:00') : new Date(iso);
  return d.toLocaleDateString('pt-BR');
}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function whatsappLink(numero, mensagem){
  if(!numero) return null;
  let digits = String(numero).replace(/\D/g,'');
  if(!digits) return null;
  if(digits.length <= 11) digits = '55' + digits; // assume Brasil se não vier com código do país
  const texto = mensagem ? `?text=${encodeURIComponent(mensagem)}` : '';
  return `https://wa.me/${digits}${texto}`;
}

    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas seguidas. Aguarde um pouco e tente de novo.',
    'auth/network-request-failed':'Falha de conexão. Verifique sua internet e tente de novo.',

  return map[code] || 'Não foi possível entrar. Tente novamente.';
