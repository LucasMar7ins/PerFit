<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxC6Z4QSz3Za3wACBMlXUw_joYoYyAzAw",
  authDomain: "fitpro-manager-ed0c8.firebaseapp.com",
  projectId: "fitpro-manager-ed0c8",
  storageBucket: "fitpro-manager-ed0c8.firebasestorage.app",
  messagingSenderId: "188505708125",
  appId: "1:188505708125:web:6273065b66d098a46c9fb4"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const dbFire = getFirestore(fbApp);

window.__fbSignIn = (email, senha) => signInWithEmailAndPassword(auth, email, senha);
window.__fbSignOut = () => signOut(auth);
window.__fbResetPassword = (email) => sendPasswordResetEmail(auth, email);

// Fila de salvamentos: garante que cada salvamento na nuvem só comece depois do anterior terminar,
// evitando que escritas concorrentes cheguem ao Firestore fora de ordem.
let filaSalvamento = Promise.resolve();
// O Firestore recusa documentos acima de 1.048.576 bytes (1MB). Como fotos e anexos ficam guardados
// dentro do próprio documento, checamos o tamanho ANTES de tentar salvar, pra avisar com uma mensagem
// clara em vez de deixar a sincronização falhar silenciosamente sem o personal entender o motivo.
const LIMITE_SEGURO_BYTES = 900000;
window.__cloudSave = (uid, data) => {
  const payload = JSON.stringify(data);
  const atualizadoEm = new Date().toISOString();
  const tamanhoBytes = new Blob([payload]).size;
  if(tamanhoBytes > LIMITE_SEGURO_BYTES){
    if(window.__showSyncWarning) window.__showSyncWarning('⚠️ Os dados ficaram grandes demais para sincronizar com a nuvem (muitas fotos ou anexos). Apague fotos ou anexos antigos para voltar a sincronizar — por enquanto, as alterações estão salvas só neste aparelho.');
    return Promise.resolve();
  }
  filaSalvamento = filaSalvamento.then(async () => {
    try {
      await setDoc(doc(dbFire, 'usuarios', uid), { payload, atualizadoEm });
      if(window.__hideSyncWarning) window.__hideSyncWarning();
    } catch(e){
      console.error('Erro ao salvar na nuvem', e);
      if(window.__showSyncWarning) window.__showSyncWarning();
    }
  });
  return filaSalvamento;
};

// Período de teste grátis: a data de início e o status de pagamento ficam numa coleção separada
// (licencas/{uid}) cuja regra do Firestore só permite ao próprio professor LER, nunca escrever
// (exceto na primeira vez, pra "ligar o cronômetro" sozinho). O acesso aos dados em usuarios/{uid}
// só é liberado pelo próprio banco de dados enquanto o teste estiver válido ou pago=true — não é
// uma trava só de tela, é aplicada no servidor do Firestore.
const DIAS_TESTE_GRATIS = 14;
async function verificarLicenca(uid, email){
  const licRef = doc(dbFire, 'licencas', uid);
  const snap = await getDoc(licRef);
  if(!snap.exists()){
    await setDoc(licRef, { email: email || '', testeIniciadoEm: serverTimestamp(), pago: false });
    return { diasRestantes: DIAS_TESTE_GRATIS, pago: false };
  }
  const dados = snap.data();
  if(dados.pago) return { diasRestantes: null, pago: true };
  const inicio = dados.testeIniciadoEm ? dados.testeIniciadoEm.toDate() : new Date();
  const diasPassados = Math.floor((Date.now() - inicio.getTime()) / (1000*60*60*24));
  return { diasRestantes: DIAS_TESTE_GRATIS - diasPassados, pago: false };
}

// Controla para qual uid os dados já foram carregados nesta sessão do app.
// O Firebase dispara onAuthStateChanged de novo sozinho em situações normais (renovação de token,
// reconexão de rede etc.) — sem essa trava, cada disparo buscaria a nuvem de novo e substituiria
// os dados em tela por uma versão possivelmente desatualizada (ex.: de antes de um salvamento terminar).
let uidCarregado = null;
onAuthStateChanged(auth, async (user) => {
  if(user){
    if(user.uid === uidCarregado) return; // mesmo usuário já carregado — evento repetido, ignorar
    uidCarregado = user.uid;
    let licenca;
    try {
      licenca = await verificarLicenca(user.uid, user.email);
    } catch(e){
      console.error('Erro ao verificar licença', e);
      licenca = { diasRestantes: DIAS_TESTE_GRATIS, pago: false };
    }
    if(!licenca.pago && typeof licenca.diasRestantes === 'number' && licenca.diasRestantes <= 0){
      if(window.__showTesteExpirado) window.__showTesteExpirado();
      return;
    }
    let cloudData = null;
    try {
      const snap = await getDoc(doc(dbFire, 'usuarios', user.uid));
      if(snap.exists() && snap.data().payload){
        cloudData = JSON.parse(snap.data().payload);
      }
    } catch(e){
      console.error('Erro ao carregar dados da nuvem', e);
      if(window.__showSyncWarning) window.__showSyncWarning();
    }
    window.__fitproReady(cloudData, user.uid, user.email, licenca);
  } else {
    uidCarregado = null;
    window.__showLogin();
  }
});
