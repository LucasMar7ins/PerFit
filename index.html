<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitPro Manager — Montagem de Treinos</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --panel2:#1a2236; --line:#26314a;
    --accent:#22d3ee; --accent2:#a78bfa; --text:#e5e7eb; --muted:#94a3b8;
    --green:#34d399; --red:#f87171; --yellow:#fbbf24;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  nav{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0;}
  nav h1{font-size:18px;padding:0 20px 20px;margin:0;color:var(--accent);border-bottom:1px solid var(--line);}
  nav h1 span{color:var(--accent2);}
  nav .tab{padding:12px 20px;cursor:pointer;color:var(--muted);font-size:14px;border-left:3px solid transparent;}
  nav .tab:hover{background:var(--panel2);color:var(--text);}
  nav .tab.active{color:var(--text);border-left-color:var(--accent);background:var(--panel2);font-weight:600;}
  main{flex:1;padding:28px 36px;max-width:1100px;}
  h2{margin-top:0;font-size:22px;}
  .sub{color:var(--muted);font-size:13px;margin-top:-8px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:7px;font-size:14px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);}
  textarea{width:100%;min-height:50px;font-family:inherit;}
  button{background:var(--accent);color:#0f172a;border:none;padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer;font-size:14px;}
  button:hover{filter:brightness(1.1);}
  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  button.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.green{background:rgba(52,211,153,.15);color:var(--green);}
  .tag.gray{background:rgba(148,163,184,.15);color:var(--muted);}
  .tag.yellow{background:rgba(251,191,36,.15);color:var(--yellow);}
  .banner{border:1px solid var(--yellow);background:rgba(251,191,36,.08);border-radius:9px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:10px;}
  .compareCol{flex:1;min-width:0;}
  .compareCol table{font-size:13px;}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:14px;}
  .studentList{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .studentCard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:.15s;}
  .studentCard:hover{border-color:var(--accent);}
  .studentCard h3{margin:0 0 4px;font-size:16px;}
  .studentCard .meta{color:var(--muted);font-size:12px;}
  .fichaHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .fichaTag{width:34px;height:34px;border-radius:8px;background:var(--accent2);color:#0f172a;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .exRow{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--panel2);}
  .exRowTop{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .exRowTop select{flex:1;min-width:0;}
  .exRowBottom{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;}
  .miniField label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  .miniField input{width:100%;}
  .exRow input{width:100%;}
  .backBtn{color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:14px;display:inline-block;}
  .modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:50;}
  .modalBg.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:420px;max-width:90vw;}
  .modal.wide{width:560px;}
  .modal{max-height:88vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .measureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .evalCard{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .evalStats{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin:10px 0;}
  .evalStat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
  .evalStat .v{font-size:16px;font-weight:700;}
  .evalStat .k{font-size:11px;color:var(--muted);text-transform:uppercase;}
  .anamneseBox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--text);white-space:pre-wrap;margin-top:6px;}
  .sectionTitle{font-size:16px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .field{margin-bottom:12px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input, .field select, .field textarea{width:100%;}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .photoThumb{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
  .photoThumb:hover{border-color:var(--accent);}
  .photoUploadRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .photoUploadRow .field label{text-align:center;}
  .photoPreview{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-top:6px;display:none;}
  .photoPreview.show{display:block;}
  .inlineEdit{background:transparent;border:1px solid transparent;color:var(--text);padding:5px 7px;border-radius:6px;font-size:14px;width:100%;min-width:60px;}
  .inlineEdit:hover{border-color:var(--line);background:var(--panel2);}
  .inlineEdit:focus{border-color:var(--accent);background:var(--panel2);outline:none;}
  .onlyPrint{display:none;}
  .collapseToggle{cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;}
  .collapseToggle:hover{color:var(--accent);}
  .collapseArrow{display:inline-block;font-size:11px;color:var(--muted);transition:transform .15s;width:10px;}
  @media print{ .collapsibleContent{display:block !important;} }
  .toastContainer{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);color:var(--text);padding:12px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transform:translateX(24px);transition:opacity .25s ease,transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(0);}
  .toast.toast-success{border-left-color:var(--green);}
  .toast.toast-error{border-left-color:var(--red);}
  .toast.toast-info{border-left-color:var(--accent);}

  /* ---------- RESPONSIVO (celular / tablet) ---------- */
  @media (max-width: 760px){
    .app{flex-direction:column;}
    nav{
      width:100%;display:flex;align-items:center;overflow-x:auto;
      padding:0;border-right:none;border-bottom:1px solid var(--line);
      -webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:20;
    }
    nav h1{display:none;}
    nav .tab{
      flex:0 0 auto;white-space:nowrap;padding:14px 16px;font-size:13px;
      border-left:none;border-bottom:3px solid transparent;
    }
    nav .tab.active{border-left:none;border-bottom-color:var(--accent);}
    main{padding:16px;max-width:100%;}
    h2{font-size:19px;}
    .card{padding:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .card table{min-width:620px;}
    button{padding:11px 16px;font-size:15px;min-height:42px;}
    button.small{padding:9px 13px;font-size:13px;min-height:36px;}
    input,select,textarea{padding:11px 12px;font-size:16px;}
    .measureGrid{grid-template-columns:repeat(2,1fr);}
    .exRowBottom{grid-template-columns:repeat(auto-fit,minmax(78px,1fr));}
    .photoUploadRow{grid-template-columns:repeat(3,1fr);gap:6px;}
    .evalStats{grid-template-columns:repeat(2,1fr);}
    .modal{padding:16px;width:94vw;max-width:94vw;}
    .row{gap:8px;}
    .fichaHeader{flex-direction:column;align-items:flex-start;gap:10px;}
    .evalCard{flex-direction:column;}
    .evalCard > div:last-child{flex-direction:row !important;width:100%;}
    .evalCard > div:last-child button{flex:1;}
    .studentList{grid-template-columns:1fr 1fr;}
  }
  @media (max-width: 460px){
    .studentList{grid-template-columns:1fr;}
    .exRowBottom{grid-template-columns:1fr 1fr;}
    .photoUploadRow{grid-template-columns:1fr;}
  }

  @media print{
    nav, .noprint, .toastContainer{display:none !important;}
    body{background:#fff;color:#000;}
    main{padding:0;max-width:100%;}
    .card{border:1px solid #ccc;background:#fff;}
    th, td{color:#000;border-color:#ccc;}
    .inlineEdit{border:none !important;background:transparent !important;color:#000 !important;padding:0;}
    .onlyPrint{display:block !important;}
  }
</style>
</head>

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(!raw){
    const seed = { students:[buildDemoStudent()], exercises: defaultExerciseLibrary() };
    localStorage.setItem(DB_KEY, JSON.stringify(seed));
    localStorage.setItem(MIGR_KEY, '1');
    return seed;
  }
  const data = JSON.parse(raw);
  // migração automática: quem já usava a versão antiga (poucos exercícios) recebe a biblioteca completa
  if(localStorage.getItem(MIGR_KEY) !== '1'){
    const existing = new Set((data.exercises||[]).map(e=>e.nome.trim().toLowerCase()));
    const toAdd = defaultExerciseLibrary().filter(e=>!existing.has(e.nome.trim().toLowerCase()));
    data.exercises = (data.exercises||[]).concat(toAdd);
    localStorage.setItem(DB_KEY, JSON.stringify(data));
    localStorage.setItem(MIGR_KEY, '1');
  }
  return data;
}

// ---------- REAVALIAÇÃO (lembrete) ----------
const REAVAL_DIAS_LIMITE = 45; // ~6-7 semanas sem atualizar medidas
function ultimaAvaliacao(s){
  const avs = (s.avaliacoes||[]).slice().filter(a=>a.data).sort((a,b)=> b.data.localeCompare(a.data));
  return avs[0] || null;
}
function diasDesde(dataISO){
  if(!dataISO) return null;
  const d = new Date(dataISO+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function reavaliacaoStatus(s){
  if((s.status||'ativo')==='pausado') return null;
  const ult = ultimaAvaliacao(s);
  if(!ult) return { atrasada:true, dias:null, motivo:'nunca' };
  const dias = diasDesde(ult.data);
  if(dias!==null && dias > REAVAL_DIAS_LIMITE) return { atrasada:true, dias, motivo:'antiga' };
  return { atrasada:false, dias };
}

function filteredStudents(){
  const term = (state.studentSearch||'').trim().toLowerCase();
  let list = db.students;
  const filtro = state.studentFilter||'ativos';
  if(filtro === 'ativos'){
    list = list.filter(s => (s.status||'ativo') !== 'pausado');
  } else if(filtro === 'atrasados'){
    list = list.filter(s => { const r = reavaliacaoStatus(s); return r && r.atrasada; });
  }
  if(term){
    list = list.filter(s=>
      (s.nome||'').toLowerCase().includes(term) ||
      (s.objetivo||'').toLowerCase().includes(term)
    );
  }
  return list;
}

function buildComparisonTable(avaliacoesAsc){
  const comAlgumDado = avaliacoesAsc.filter(av=> TABELA_COMPARATIVA_PARAMS.some(p=> (av[p.key]||'').toString().trim() !== ''));
  if(comAlgumDado.length < 2) return '';

function buildEvolutionChart(avaliacoesAsc, metricKey, unit){
  const pontos = avaliacoesAsc
    .map(av=>({data:av.data, valor: parseFloat(String(av[metricKey]).replace(',','.'))}))
    .filter(p=> !isNaN(p.valor));
  if(pontos.length < 2){
    return '<div class="empty">Registre pelo menos 2 avaliações com esse dado preenchido para ver o gráfico.</div>';
  }
  const W = 640, H = 220, padL = 46, padR = 20, padT = 20, padB = 34;
  const vals = pontos.map(p=>p.valor);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  const x = i => padL + (i/(pontos.length-1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - min)/range) * (H - padT - padB);
  const linePoints = pontos.map((p,i)=> `${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const dots = pontos.map((p,i)=> `
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="4" fill="var(--accent)"></circle>
    <text x="${x(i).toFixed(1)}" y="${(y(p.valor)-10).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text)" font-weight="600">${p.valor}${unit}</text>
    <text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${formatDate(p.data)}</text>
  `).join('');
  const first = pontos[0].valor, last = pontos[pontos.length-1].valor;
  const diff = last - first;
  const diffColor = diff>0?'var(--green)':(diff<0?'var(--red)':'var(--muted)');
  const diffArrow = diff>0?'▲':(diff<0?'▼':'—');
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span class="meta">${pontos.length} registro(s)</span>
      <span style="color:${diffColor};font-weight:700;font-size:13px;">${diffArrow} ${diff>0?'+':''}${diff.toFixed(1)}${unit} desde ${formatDate(pontos[0].data)}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"></line>
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2.5"></polyline>
      ${dots}
    </svg>
  `;
}

  s.cargaLog = s.cargaLog || [];
  const cargaGroups = new Map();
  s.cargaLog.forEach(entry=>{

  const cargaHtml = [...cargaGroups.values()].map(group=>{
    const sorted = group.entries.slice().sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    const first = sorted[0], last = sorted[sorted.length-1];
    const numFirst = parseFloat(String(first.carga).replace(',','.'));
    const numLast = parseFloat(String(last.carga).replace(',','.'));
    let deltaHtml = '';
    if(sorted.length>1 && !isNaN(numFirst) && !isNaN(numLast)){
      const diff = numLast - numFirst;
      const color = diff>0?'var(--green)':(diff<0?'var(--red)':'var(--muted)');
      const arrow = diff>0?'▲':(diff<0?'▼':'—');
      deltaHtml = `<span style="color:${color};font-weight:700;font-size:13px;">${arrow} ${diff>0?'+':''}${diff.toFixed(1)} desde ${formatDate(first.data)}</span>`;
    }
    const rows = sorted.slice().reverse().map(e=>`
      <tr>
        <td>${formatDate(e.data)}</td>
        <td>${escapeHtml(e.carga)}</td>
        <td>${escapeHtml(e.reps||'-')}</td>

        <div class="row" style="justify-content:space-between;margin-bottom:8px;">

        </div>

          <thead><tr><th>Data</th><th>Carga</th><th>Reps</th><th>Obs</th><th class="noprint"></th></tr></thead>

  const fichas = s.fichas.slice().sort((a,b)=> (b.criadoEm||'').localeCompare(a.criadoEm||''));

    return `

        <tbody>
          ${f.exercicios.map(e=>`<tr>

            <td>${escapeHtml(e.grupo||'-')}</td>
            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|series" value="${escapeAttr(e.series||'')}" placeholder="-"></td>

            <td><input class="inlineEdit noprint-border" data-field-exec="${f.id}|${e.id}|obs" value="${escapeAttr(e.obs||'')}" placeholder="-"></td>

    <div class="row noprint" style="margin-bottom:18px;">

    <div class="sectionTitle">
      <span class="collapseToggle" data-toggle-section="anamnese"><span class="collapseArrow">${state.collapsedSections.anamnese?'▶':'▼'}</span> 🩺 Anamnese completa</span>

function filteredExercises(){

  return db.exercises.filter(e=>
    (e.nome||'').toLowerCase().includes(term) ||
    (e.grupo||'').toLowerCase().includes(term)
  );
}
function renderExerciseRows(){
  const filtered = filteredExercises();
  const tbody = document.getElementById('exTableBody');
  if(!tbody) return;
  tbody.innerHTML = filtered.map(exerciseRowHtml).join('') || '<tr><td colspan="7" class="empty">Nenhum exercício encontrado para essa busca.</td></tr>';

  if(countLabel) countLabel.textContent = `${filtered.length} de ${db.exercises.length} exercício(s)`;
  bindExerciseRowEvents();
}
function bindExerciseRowEvents(){

// ---------- BACKUP ----------
function renderBackup(){
  const totalFichas = db.students.reduce((n,s)=>n+(s.fichas||[]).length,0);
  const totalAval = db.students.reduce((n,s)=>n+(s.avaliacoes||[]).length,0);
  const totalCargas = db.students.reduce((n,s)=>n+(s.cargaLog||[]).length,0);
  const totalFotos = db.students.reduce((n,s)=>n+(s.avaliacoes||[]).reduce((m,av)=> m + (av.fotos ? Object.values(av.fotos).filter(Boolean).length : 0), 0), 0);
  const sizeBytes = new Blob([JSON.stringify(db)]).size;
  const sizeLabel = sizeBytes > 1024*1024 ? (sizeBytes/1024/1024).toFixed(1)+' MB' : (sizeBytes/1024).toFixed(0)+' KB';
  return `
    <h2>Backup dos dados</h2>
    <div class="sub">Todos os dados ficam salvos apenas neste navegador. Exporte um backup regularmente para não perder nada ao trocar de computador, limpar o cache ou reinstalar o navegador.</div>
    <div class="card">
      <div class="evalStats" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));">
        <div class="evalStat"><div class="v">${db.students.length}</div><div class="k">Alunos</div></div>
        <div class="evalStat"><div class="v">${totalFichas}</div><div class="k">Fichas</div></div>
        <div class="evalStat"><div class="v">${totalAval}</div><div class="k">Avaliações</div></div>
        <div class="evalStat"><div class="v">${totalCargas}</div><div class="k">Registros de carga</div></div>
        <div class="evalStat"><div class="v">${totalFotos}</div><div class="k">Fotos</div></div>
        <div class="evalStat"><div class="v">${db.exercises.length}</div><div class="k">Exercícios</div></div>
        <div class="evalStat"><div class="v">${sizeLabel}</div><div class="k">Tamanho total</div></div>
      </div>
    </div>
    <div class="card noprint">
      <div style="font-weight:600;margin-bottom:8px;">Exportar backup</div>
      <div class="meta" style="margin-bottom:12px;">Gera um arquivo .json com todos os alunos, fichas, avaliações e o banco de exercícios.</div>
      <button id="btnExportBackup">⬇ Baixar backup (.json)</button>
    </div>
    <div class="card noprint">
      <div style="font-weight:600;margin-bottom:8px;">Importar / Restaurar backup</div>
      <div class="meta" style="margin-bottom:12px;">Selecione um arquivo .json exportado anteriormente. Isso <strong>substitui</strong> todos os dados atuais deste navegador.</div>
      <input type="file" id="inputImportBackup" accept="application/json,.json">
    </div>
  `;
}

function exportBackup(){
  const payload = { ...db, exportadoEm: new Date().toISOString(), versao: 1 };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `fitpro-backup-${dataStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  try{ URL.revokeObjectURL(url); }catch(e){}
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.students) || !Array.isArray(parsed.exercises)){
        showToast('Arquivo inválido: não parece ser um backup do FitPro Manager.', 'error');
        return;
      }
      showConfirm('Isso vai SUBSTITUIR todos os dados atuais por este backup. Deseja continuar?', ()=>{
        db = { students: parsed.students, exercises: parsed.exercises };
        saveDB();
        localStorage.setItem(MIGR_KEY, '1');
        showToast('Backup restaurado com sucesso.', 'success');
        render();
      }, {danger:true, confirmLabel:'Restaurar'});
    } catch(e){
      showToast('Não foi possível ler o arquivo. Verifique se é um backup .json válido.', 'error');
    }
  };
  reader.readAsText(file);
}

      const s = db.students.find(x=>x.id===state.studentId);

      const f = s.fichas.find(x=>x.id===fichaId);

  document.querySelectorAll('[data-reset-checks]').forEach(el=>{

      const s = db.students.find(x=>x.id===state.studentId);

  const backFromPrint = document.getElementById('backFromPrint');
  if(backFromPrint) backFromPrint.onclick = ()=>{ state.printFicha = null; render(); };
  document.querySelectorAll('[data-del-ficha]').forEach(el=>{

      showConfirm('Excluir esta ficha?', ()=>{

        saveDB(); render();

  const btnAddEx = document.getElementById('btnAddEx');

  if(btnImportLib) btnImportLib.onclick = ()=>{
    const existing = new Set(db.exercises.map(e=>e.nome.trim().toLowerCase()));
    const toAdd = defaultExerciseLibrary().filter(e=>!existing.has(e.nome.trim().toLowerCase()));
    if(toAdd.length===0){ showToast('Sua biblioteca já tem todos os exercícios padrão.', 'info'); return; }
    db.exercises = db.exercises.concat(toAdd);
    saveDB(); render();
    showToast(toAdd.length + ' exercício(s) novo(s) adicionado(s) à biblioteca.', 'success');
  };
  bindExerciseRowEvents();

  const exSearchInput = document.getElementById('exSearchInput');
  if(exSearchInput) exSearchInput.oninput = ()=>{
    state.exerciseSearch = exSearchInput.value;
    renderExerciseRows();
  };
}

// ---------- MODALS ----------
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.getElementById('modalBody').classList.remove('wide');
}
document.getElementById('modalBg').addEventListener('click', e=>{
  if(e.target.id==='modalBg') closeModal();
});

// ---------- TOAST / CONFIRMAÇÃO (substituem alert()/confirm() nativos) ----------
function showToast(message, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = message;
  container.appendChild(el);
  const raf = (typeof window !== 'undefined' && window.requestAnimationFrame) ? window.requestAnimationFrame.bind(window) : (cb)=>setTimeout(cb,16);
  raf(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  }, 3400);
}
function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  openModal(`
    <h3 style="margin-bottom:10px;">${opts.title ? escapeHtml(opts.title) : 'Confirmar ação'}</h3>
    <div style="margin-bottom:18px;color:var(--text);font-size:14px;">${escapeHtml(message)}</div>
    <div class="actions">
      <button class="secondary" id="confirmCancelBtn">Cancelar</button>
      <button class="${opts.danger?'danger':''}" id="confirmActionBtn">${escapeHtml(opts.confirmLabel||'Confirmar')}</button>
    </div>
  `);
  document.getElementById('confirmCancelBtn').onclick = ()=>{
    closeModal();
    if(opts.onCancel) opts.onCancel();
  };
  document.getElementById('confirmActionBtn').onclick = ()=>{
    closeModal();
    onConfirm();
  };
}

    </div>
    <div class="anamneseBox" style="margin-top:-4px;margin-bottom:10px;font-size:12px;">
      ⚠️ O % de gordura é uma <strong>estimativa</strong> pelo método US Navy (fita métrica), com margem de erro de aproximadamente 3-4% em relação a exames de laboratório (DEXA), e tende a errar mais em pessoas muito magras ou muito musculosas. Se você tiver adipômetro, bioimpedância ou outro equipamento próprio, digite o valor real por cima — o campo é totalmente editável e seu valor não será sobrescrito sozinho.

      <div class="photoUploadRow">
        ${['frente','lado','costas'].map(k=>`

            <input type="file" accept="image/*" id="avFoto_${k}" style="width:100%;font-size:12px;">
            <img id="avFotoPrev_${k}" class="photoPreview ${editing && av.fotos && av.fotos[k] ? 'show':''}" src="${editing && av.fotos && av.fotos[k] ? av.fotos[k] : ''}">
          </div>
        `).join('')}
      </div>
      <div class="meta" style="margin-top:6px;">As fotos são redimensionadas automaticamente para não pesar no navegador.</div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button id="avSave">Salvar avaliação</button>
    </div>
  `);

  ['frente','lado','costas'].forEach(k=>{
    const input = document.getElementById('avFoto_'+k);
    input.onchange = async ()=>{
      const file = input.files[0];
      if(!file) return;
      const dataUrl = await resizeImageFile(file, 700, 0.72);
      const prev = document.getElementById('avFotoPrev_'+k);
      prev.src = dataUrl;
      prev.classList.add('show');
      prev.dataset.value = dataUrl;
    };
  });

  let manualOverride = false;
  function recalcularGordura(force){
    const hint = document.getElementById('avGorduraHint');
    if(manualOverride && !force){
      hint.textContent = 'Valor digitado manualmente — não será sobrescrito automaticamente. Clique em 🔄 para recalcular pela fórmula.';
      hint.style.color = 'var(--muted)';
      return;
    }
    const alturaCm = parseFloat(document.getElementById('avAltura').value.replace(',','.'));
    const cintura = parseFloat(document.getElementById('avCintura').value.replace(',','.'));
    const pescoco = parseFloat(document.getElementById('avPescoco').value.replace(',','.'));
    const quadril = parseFloat(document.getElementById('avQuadril').value.replace(',','.'));
    if(!s.sexo){
      hint.textContent = 'Defina o sexo do aluno em "Editar aluno" para habilitar o cálculo automático.';
      hint.style.color = 'var(--yellow)';
      return;
    }
    const faltando = [];
    if(isNaN(alturaCm)||alturaCm<=0) faltando.push('altura');
    if(isNaN(cintura)||cintura<=0) faltando.push('cintura');
    if(isNaN(pescoco)||pescoco<=0) faltando.push('pescoço');
    if(s.sexo==='F' && (isNaN(quadril)||quadril<=0)) faltando.push('quadril');
    if(faltando.length){
      hint.textContent = `Preencha ${faltando.join(', ')} para calcular a % de gordura automaticamente (método US Navy, por fita métrica).`;
      hint.style.color = 'var(--muted)';
      return;
    }
    let gordura;
    if(s.sexo === 'M'){
      if(cintura <= pescoco){
        hint.textContent = 'A medida da cintura precisa ser maior que a do pescoço para calcular.';
        hint.style.color = 'var(--yellow)';
        return;
      }
      gordura = 495 / (1.0324 - 0.19077*Math.log10(cintura-pescoco) + 0.15456*Math.log10(alturaCm)) - 450;
    } else {
      if((cintura+quadril) <= pescoco){
        hint.textContent = 'As medidas informadas não são válidas para o cálculo.';
        hint.style.color = 'var(--yellow)';
        return;
      }
      gordura = 495 / (1.29579 - 0.35004*Math.log10(cintura+quadril-pescoco) + 0.22100*Math.log10(alturaCm)) - 450;
    }
    const gorduraFinal = Math.max(gordura, 0).toFixed(1);
    document.getElementById('avPercGordura').value = gorduraFinal;
    manualOverride = false;
    hint.textContent = 'Estimativa calculada (método US Navy, por fita métrica: cintura, pescoço' + (s.sexo==='F'?', quadril':'') + ' e altura). Digite por cima a qualquer momento se tiver uma medição real.';
    hint.style.color = 'var(--green)';
  }
  ['avAltura','avCintura','avPescoco','avQuadril'].forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>recalcularGordura(false));
  });
  document.getElementById('avPercGordura').addEventListener('input', ()=>{ manualOverride = true; });
  document.getElementById('avRecalcBtn').addEventListener('click', ()=>{ manualOverride = false; recalcularGordura(true); });
  // Se já existir um valor salvo (edição), tratamos como possível valor manual e não sobrescrevemos de imediato.
  if(editing && av.percGordura){ manualOverride = true; }
  recalcularGordura(false);

  document.getElementById('avSave').onclick = ()=>{
    const data = document.getElementById('avData').value || today;
    const fotos = {};
    ['frente','lado','costas'].forEach(k=>{
      const prev = document.getElementById('avFotoPrev_'+k);
      fotos[k] = prev.dataset.value || (editing && av.fotos ? (av.fotos[k]||'') : '');
    });
    const payload = {
      data,
      idade: document.getElementById('avIdade').value.trim(),
      peso: document.getElementById('avPeso').value.trim(),
      altura: document.getElementById('avAltura').value.trim(),
      percGordura: document.getElementById('avPercGordura').value.trim(),
      circPescoco: document.getElementById('avPescoco').value.trim(),
      circPeito: document.getElementById('avPeito').value.trim(),
      circCintura: document.getElementById('avCintura').value.trim(),
      circQuadril: document.getElementById('avQuadril').value.trim(),
      circAbdomen: document.getElementById('avAbdomen').value.trim(),
      circBraco: document.getElementById('avBraco').value.trim(),
      circCoxa: document.getElementById('avCoxa').value.trim(),
      circPanturrilha: document.getElementById('avPanturrilha').value.trim(),
      dobraTricipital: document.getElementById('avDobraTricipital').value.trim(),
      dobraBicipital: document.getElementById('avDobraBicipital').value.trim(),
      dobraAbdominal: document.getElementById('avDobraAbdominal').value.trim(),
      dobraSubescapular: document.getElementById('avDobraSubescapular').value.trim(),
      dobraCoxa: document.getElementById('avDobraCoxa').value.trim(),
      dobraToracica: document.getElementById('avDobraToracica').value.trim(),
      dobraSuprailiaca: document.getElementById('avDobraSuprailiaca').value.trim(),
      dobraSupraespinhal: document.getElementById('avDobraSupraespinhal').value.trim(),
      fotos,
    };
    if(editing){
      Object.assign(av, payload);
    } else {
      s.avaliacoes = s.avaliacoes || [];
      s.avaliacoes.push({id:uid(), ...payload});
    }
    saveDB(); closeModal(); render();
  };
}

  const today = new Date().toISOString().slice(0,10);
  const exOptions = db.exercises.slice().sort((a,b)=>a.nome.localeCompare(b.nome))
    .map(e=>`<option value="${escapeAttr(e.nome)}" ${editing&&entry.exercicio===e.nome?'selected':''}>${escapeHtml(e.nome)}</option>`).join('');
  openModal(`
    <h3>${editing?'Editar registro de carga':'Registrar carga'}</h3>
    <div class="field"><label>Exercício</label>
      <select id="cExercicio">
        <option value="">Selecione um exercício do banco...</option>
        ${exOptions}
      </select>
    </div>
    <div class="field"><label>Ou digite o nome (se não estiver no banco)</label><input id="cExercicioManual" placeholder="Nome do exercício" value="${editing && !db.exercises.some(e=>e.nome===entry.exercicio) ? escapeAttr(entry.exercicio):''}"></div>
    <div class="row">
      <div class="field" style="flex:1"><label>Data</label><input type="date" id="cData" value="${editing?(entry.data||today):today}"></div>
      <div class="field" style="flex:1"><label>Carga (kg)</label><input id="cCarga" placeholder="Ex: 25" value="${editing?escapeAttr(entry.carga||''):''}"></div>
      <div class="field" style="flex:1"><label>Reps</label><input id="cReps" placeholder="Ex: 10x3" value="${editing?escapeAttr(entry.reps||''):''}"></div>
    </div>
    <div class="field"><label>Observações</label><textarea id="cObs">${editing?escapeHtml(entry.obs||''):''}</textarea></div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button id="cSave">Salvar registro</button>
    </div>
  `);
  document.getElementById('cSave').onclick = ()=>{
    const manual = document.getElementById('cExercicioManual').value.trim();
    const selected = document.getElementById('cExercicio').value;
    const exercicio = manual || selected;
    if(!exercicio){ showToast('Selecione ou digite o exercício.', 'error'); return; }
    const carga = document.getElementById('cCarga').value.trim();
    if(!carga){ showToast('Informe a carga.', 'error'); return; }
    const payload = {
      exercicio,
      data: document.getElementById('cData').value || today,
      carga,
      reps: document.getElementById('cReps').value.trim(),
      obs: document.getElementById('cObs').value.trim(),
    };
    s.cargaLog = s.cargaLog || [];
    if(editing){
      Object.assign(entry, payload);
    } else {
      s.cargaLog.push({id:uid(), ...payload});
    }
    saveDB(); closeModal(); render();
  };
}

function compareTableHtml(f){
  if(!f) return '<div class="empty">Selecione uma ficha.</div>';
  return `
    <div style="font-weight:600;margin-bottom:2px;">${escapeHtml(f.nome||('Treino '+f.letra))}</div>
    <div class="meta" style="margin-bottom:8px;">Treino ${escapeHtml(f.letra)} • ${f.ativa?'ativa':'arquivada'} • criada em ${formatDate(f.criadoEm)}</div>
    <table>
      <thead><tr><th>Exercício</th><th>Séries</th><th>Reps</th><th>Carga</th><th>Descanso</th></tr></thead>
      <tbody>
        ${f.exercicios.map(e=>`<tr><td>${escapeHtml(e.nome)}</td><td>${escapeHtml(e.series||'-')}</td><td>${escapeHtml(e.reps||'-')}</td><td>${escapeHtml(e.obs||'-')}</td><td>${escapeHtml(e.descanso||'-')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Sem exercícios.</td></tr>'}
      </tbody>
    </table>
  `;
}
function openCompareModal(fichaA){
  const s = db.students.find(x=>x.id===state.studentId);
  const others = s.fichas.filter(f=>f.id!==fichaA.id).slice().sort((a,b)=> (b.criadoEm||'').localeCompare(a.criadoEm||''));
  if(others.length===0){ showToast('Este aluno só tem uma ficha, não há outra para comparar.', 'info'); return; }
  document.getElementById('modalBody').classList.add('wide');
  openModal(`
    <h3 style="margin-bottom:10px;">Comparar fichas — ${escapeHtml(s.nome)}</h3>
    <div class="field"><label>Comparar "${escapeHtml(fichaA.nome||('Treino '+fichaA.letra))}" com:</label>
      <select id="compareSelect">
        ${others.map(f=>`<option value="${f.id}">${escapeHtml(f.nome||('Treino '+f.letra))} (${f.ativa?'ativa':'arquivada'})</option>`).join('')}
      </select>
    </div>
    <div class="row" style="align-items:flex-start;gap:16px;margin-top:14px;">
      <div class="compareCol">${compareTableHtml(fichaA)}</div>
      <div class="compareCol" id="compareColB">${compareTableHtml(others[0])}</div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Fechar</button>
    </div>
  `);
  document.getElementById('compareSelect').onchange = (e)=>{
    const fB = s.fichas.find(x=>x.id===e.target.value);
    document.getElementById('compareColB').innerHTML = compareTableHtml(fB);
  };
}

function openFichaModal(ficha){
  const editing = !!ficha;
  const s = db.students.find(x=>x.id===state.studentId);
  const letters = s.fichas.map(f=>f.letra);
  const workingList = editing ? JSON.parse(JSON.stringify(ficha.exercicios)) : [];

  function exOptions(selectedNome){
    return db.exercises.map(e=>`<option value="${escapeAttr(e.nome)}" ${e.nome===selectedNome?'selected':''}>${escapeHtml(e.nome)}</option>`).join('');
  }
  function rowsHtml(){
    return workingList.map((e,i)=>`
      <div class="exRow" data-idx="${i}">
        <div class="exRowTop">
          <select class="rEx">${'<option value="">Selecione o exercício...</option>'+exOptions(e.nome)}</select>
          <button class="danger small" data-rm="${i}" title="Remover">✕</button>
        </div>
        <div class="exRowBottom">
          <div class="miniField"><label>Séries</label><input class="rSeries" placeholder="Ex: 3" value="${escapeAttr(e.series||'')}"></div>
          <div class="miniField"><label>Reps</label><input class="rReps" placeholder="Ex: 12" value="${escapeAttr(e.reps||'')}"></div>
          <div class="miniField"><label>Carga</label><input class="rObs" placeholder="Ex: 20kg" value="${escapeAttr(e.obs||'')}"></div>
          <div class="miniField"><label>Descanso</label><input class="rDescanso" placeholder="Ex: 60s" value="${escapeAttr(e.descanso||'')}"></div>
          <div class="miniField"><label>Anotações</label><input class="rNotas" placeholder="dor, dificuldade..." value="${escapeAttr(e.notas||'')}"></div>
        </div>
        <input class="rGrupo" style="display:none" value="${escapeAttr(e.grupo||'')}">
        <input class="rVideo" style="display:none" value="${escapeAttr(e.video||'')}">
      </div>
    `).join('');
  }

  document.getElementById('modalBody').classList.add('wide');
  openModal(`
    <h3 style="margin-bottom:2px;">${editing?'Editar ficha':'Nova ficha de treino'}</h3>
    ${!editing ? `
    <div class="field">
      <label>Começar de um modelo (opcional)</label>
      <select id="fTemplate">
        <option value="">Em branco</option>
        ${Object.entries(TEMPLATES_FICHA).map(([key,t])=>`<option value="${key}">${escapeHtml(t.label)}</option>`).join('')}
      </select>
      <div class="meta">O modelo só preenche exercício e grupo — séries, reps e carga continuam em branco pra você digitar.</div>
    </div>
    ` : ''}
    <div class="row">
      <div class="field" style="flex:1"><label>Letra</label><input id="fLetra" maxlength="2" value="${editing?escapeAttr(ficha.letra):nextLetter(letters)}"></div>
      <div class="field" style="flex:2"><label>Nome (opcional)</label><input id="fNome" value="${editing?escapeAttr(ficha.nome||''):''}" placeholder="Ex: Treino de peito e tríceps"></div>
    </div>
    <div id="exList">${rowsHtml()}</div>
    <button class="secondary small noprint" id="fAddRow" style="margin-top:6px;">+ Adicionar exercício</button>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button id="fSave">Salvar ficha</button>
    </div>
  `);

  function bindRowRemovals(){
    document.querySelectorAll('#exList [data-rm]').forEach(btn=>{
      btn.onclick = ()=>{ workingList.splice(Number(btn.dataset.rm),1); refreshRows(); };
    });
    document.querySelectorAll('#exList .rEx').forEach((sel,i)=>{
      sel.onchange = ()=>{
        // Apenas define o nome/grupo do exercício. Séries, reps e carga são sempre digitados
        // manualmente pelo personal, nunca preenchidos automaticamente pelo banco.
        const chosen = db.exercises.find(e=>e.nome===sel.value);
        if(chosen){
          workingList[i].nome = chosen.nome;
          workingList[i].grupo = chosen.grupo;
          workingList[i].video = chosen.video || '';
          const row = sel.closest('.exRow');
          row.querySelector('.rGrupo').value = chosen.grupo || '';
          row.querySelector('.rVideo').value = chosen.video || '';
        }
      };
    });
  }
  function refreshRows(){
    document.getElementById('exList').innerHTML = rowsHtml();
    bindRowRemovals();
  }
  bindRowRemovals();

  document.getElementById('fAddRow').onclick = ()=>{
    workingList.push({nome:'',grupo:'',series:'',reps:'',obs:'',video:'',notas:'',descanso:''});
    refreshRows();
  };

  const fTemplate = document.getElementById('fTemplate');
  if(fTemplate) fTemplate.onchange = ()=>{
    const key = fTemplate.value;
    if(!key){ return; }
    const aplicarTemplate = ()=>{
      const template = TEMPLATES_FICHA[key];
      workingList.length = 0;
      template.exercicios.forEach(nome=>{
        const ex = db.exercises.find(e=>e.nome===nome);
        workingList.push({nome, grupo: ex?ex.grupo:'', series:'', reps:'', obs:'', video: ex&&ex.video?ex.video:'', notas:'', descanso:''});
      });
      refreshRows();
    };
    if(workingList.length>0){
      showConfirm('Isso substitui os exercícios já adicionados nesta ficha pelo modelo escolhido. Continuar?', aplicarTemplate, {confirmLabel:'Substituir', onCancel: ()=>{ fTemplate.value = ''; }});
    } else {
      aplicarTemplate();
    }
  };

  document.getElementById('fSave').onclick = ()=>{
    // collect current row values into workingList before saving
    document.querySelectorAll('#exList .exRow').forEach((row,i)=>{
      workingList[i].nome = row.querySelector('.rEx').value || workingList[i].nome;
      workingList[i].grupo = row.querySelector('.rGrupo').value;
      workingList[i].video = row.querySelector('.rVideo').value;
      workingList[i].series = row.querySelector('.rSeries').value;
      workingList[i].reps = row.querySelector('.rReps').value;
      workingList[i].obs = row.querySelector('.rObs').value;
      workingList[i].descanso = row.querySelector('.rDescanso').value;
      workingList[i].notas = row.querySelector('.rNotas').value;
    });
    const cleaned = workingList.filter(e=>e.nome).map(e=>({
      id: e.id || uid(),
      nome: e.nome, grupo: e.grupo||'', series: e.series||'', reps: e.reps||'', obs: e.obs||'', video: e.video||'', notas: e.notas||'', descanso: e.descanso||'',
      feito: e.feito || false
    }));
    if(cleaned.length===0){ showToast('Adicione ao menos um exercício.', 'error'); return; }
    const letra = document.getElementById('fLetra').value.trim() || 'A';
    const nome = document.getElementById('fNome').value.trim();
    if(editing){
      ficha.letra = letra; ficha.nome = nome; ficha.exercicios = cleaned;
    } else {
      s.fichas.push({id:uid(),letra,nome,exercicios:cleaned,ativa:true,criadoEm:new Date().toISOString()});
    }
    saveDB(); closeModal(); render();
  };
}

// ---------- IMAGE HELPERS ----------
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- HELPERS ----------
function nextLetter(existing){
  const letters = 'ABCDEFGH';
  for(const l of letters){ if(!existing.includes(l)) return l; }
  return 'X';
}
function formatDate(iso){
  if(!iso) return '-';
  // Datas "apenas dia" (YYYY-MM-DD, sem hora) são interpretadas como meia-noite UTC pelo Date nativo,
  // o que pode "voltar" um dia ao converter para o fuso local. Forçamos meia-noite local nesse caso.
  const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso+'T00:00:00') : new Date(iso);
  return d.toLocaleDateString('pt-BR');
}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

render();
